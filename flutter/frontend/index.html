<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4b1628"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192-v2.png"><script defer src="pwa-install.js"></script><title>FLUTTER — He remembers you</title><script src="config.js"></script><script src="editions.js"></script><script src="audio.js"></script><script src="opening.js"></script>
<style>
:root{--accent:#e87aa8;--hue:320;--edition-bg0:#0c1720;--edition-bg1:#233343;--edition-bg2:#111a22;--edition-glowA:#d07c63;--edition-glowB:#547e99;--edition-ink:#f4eee8;--edition-muted:#c7bdba;--edition-font:'Avenir Next','Helvetica Neue',Inter,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#3a2b33}
#app{position:fixed;inset:0;display:flex;flex-direction:column;margin:0 auto;overflow:hidden}
.lang{position:absolute;top:12px;right:12px;z-index:80;background:rgba(255,255,255,.12);color:var(--edition-ink);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:5px 28px 5px 12px;min-height:44px;font-size:.78em;cursor:pointer;backdrop-filter:blur(10px);font-family:var(--edition-font)}
.sound-btn{position:absolute;top:12px;right:140px;z-index:81;width:44px;height:44px;border:1px solid rgba(255,255,255,.22);border-radius:50%;cursor:pointer;color:var(--edition-ink);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);font-size:1.05em}
.sound-panel{position:absolute;z-index:90;top:62px;right:12px;width:min(330px,calc(100vw - 24px));display:none;padding:18px;color:var(--edition-ink);font:500 .82em/1.4 var(--edition-font);background:color-mix(in srgb,var(--edition-bg0) 88%,transparent);border:1px solid color-mix(in srgb,var(--edition-glowA) 34%,transparent);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(22px)}
.sound-panel.show{display:block;animation:audioIn .24s ease both}.sound-title{letter-spacing:.18em;font-size:.8em;margin-bottom:14px;color:var(--edition-glowA)}
.sound-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin:12px 0}.sound-row.stack{grid-template-columns:1fr}.sound-row input[type="range"]{width:118px;accent-color:var(--edition-glowA)}
.sound-row select{max-width:185px;padding:8px 28px 8px 10px;border:1px solid color-mix(in srgb,var(--edition-glowA) 30%,transparent);border-radius:10px;background:var(--edition-bg1);color:var(--edition-ink);font:inherit}
.sound-note{min-height:1.4em;color:var(--edition-muted);font-size:.75em;line-height:1.5}.sound-check{width:18px;height:18px;accent-color:var(--edition-glowA)}
@keyframes audioIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
html[data-edition="ja"] .sound-btn,html[data-edition="ja"] .sound-panel,html[data-edition="ja"] .sound-row select{border-radius:2px}

/* ---------- 选人画面 ---------- */
#select{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:64px clamp(18px,4vw,56px) 24px;
  background:linear-gradient(150deg,var(--edition-bg0) 0%,var(--edition-bg1) 45%,var(--edition-bg2) 100%);isolation:isolate;font-family:var(--edition-font)}
#select.reveal{display:flex;animation:selectionArrive .85s cubic-bezier(.16,.8,.2,1) both}
#select.leaving{pointer-events:none;animation:selectionLeave .72s cubic-bezier(.65,0,.85,.25) both}
#select::before{content:"";position:absolute;inset:-20%;z-index:-3;background:
  radial-gradient(ellipse at 20% 20%,color-mix(in srgb,var(--edition-glowA) 34%,transparent),transparent 34%),
  radial-gradient(ellipse at 80% 75%,color-mix(in srgb,var(--edition-glowB) 28%,transparent),transparent 38%);
  animation:titleAurora 11s ease-in-out infinite alternate}
.title-noise{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
.title-orbit{position:absolute;width:74vw;max-width:390px;aspect-ratio:1;top:-16%;right:-34%;border:1px solid rgba(247,197,207,.18);
  border-radius:50%;box-shadow:0 0 80px rgba(232,122,168,.12);animation:titleOrbit 18s linear infinite}
.title-orbit::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;top:50%;left:-4px;background:#f5c8d2;
  box-shadow:0 0 18px 6px rgba(245,200,210,.48)}
.brand{position:relative;text-align:center;margin-bottom:2px;animation:titleReveal 1.2s cubic-bezier(.2,.8,.2,1) both}
#select h1{font-family:var(--edition-font);font-size:clamp(2.7em,12vw,4.1em);font-weight:300;margin:0;letter-spacing:.2em;
  color:var(--edition-ink);text-indent:.22em;text-shadow:0 4px 30px color-mix(in srgb,var(--edition-glowA) 42%,transparent)}
.brand-local{min-height:18px;margin-top:3px;color:var(--edition-glowA);font-family:var(--edition-font);font-size:.75em;font-weight:400;letter-spacing:.48em;text-indent:.48em}
.pulse-line{width:min(230px,62vw);height:20px;margin:4px auto 0;overflow:visible}
.pulse-line path{fill:none;stroke:#e6a6b9;stroke-width:1.35;stroke-linecap:round;stroke-dasharray:340;stroke-dashoffset:340;
  filter:drop-shadow(0 0 5px rgba(232,122,168,.8));animation:drawPulse 2.2s ease .35s forwards}
.brand-category{margin-top:7px;color:var(--edition-muted);font:500 clamp(.54em,1.25vw,.68em)/1.2 var(--edition-font);
  letter-spacing:.32em;text-indent:.32em;opacity:.68;white-space:nowrap;animation:titleReveal 1s ease .55s both}
#select .sub{color:var(--edition-muted);margin-bottom:8px;font-size:.88em;letter-spacing:.08em;animation:titleReveal 1s ease .45s both}
#cards{width:min(100%,1120px);display:grid;grid-template-columns:repeat(var(--route-count,3),minmax(0,1fr));gap:clamp(10px,2vw,24px);
  animation:titleReveal 1s ease .7s both;perspective:1200px}
#cards:has(.card:only-child){max-width:360px}
@keyframes titleAurora{to{transform:translate3d(-4%,3%,0) scale(1.08);filter:hue-rotate(8deg)}}
@keyframes titleOrbit{to{transform:rotate(360deg)}}
@keyframes titleReveal{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes drawPulse{70%,100%{stroke-dashoffset:0}85%{opacity:1}100%{opacity:.68}}
@keyframes selectionArrive{from{opacity:0;clip-path:inset(0 50% 0 50%)}to{opacity:1;clip-path:inset(0)}}
@keyframes selectionLeave{to{opacity:0;filter:blur(12px);transform:scale(1.035)}}

/* ---------- Edition art direction: shared soul, different markets ---------- */
/* 中文《怦然》：柔软、被偏爱、糖度高，但以光和触感代替廉价贴纸感 */
html[data-edition="zh"] #select{background:
  radial-gradient(circle at 50% 14%,rgba(255,255,255,.82),transparent 24%),
  linear-gradient(155deg,#fbe4ec 0%,#eec5d6 48%,#cfaecf 100%)}
html[data-edition="zh"] #select::before{background:
  radial-gradient(circle at 12% 24%,rgba(255,255,255,.7),transparent 21%),
  radial-gradient(circle at 84% 70%,rgba(255,217,232,.72),transparent 25%);animation:zhDream 7s ease-in-out infinite alternate}
html[data-edition="zh"] .title-noise{opacity:.05}
html[data-edition="zh"] .title-orbit{width:260px;top:-70px;right:-100px;border-color:rgba(147,72,111,.15);animation-duration:26s}
html[data-edition="zh"] #select h1{font-size:1.05em;font-weight:600;letter-spacing:.48em;color:#92506d;text-shadow:none}
html[data-edition="zh"] .brand-local{font-size:2.5em;font-weight:600;letter-spacing:.28em;text-indent:.28em;margin-top:7px;color:#a84470;
  text-shadow:0 8px 28px rgba(198,79,127,.25)}
html[data-edition="zh"] .pulse-line path{stroke:#bc527e}
html[data-edition="zh"] #select .sub{color:#7c5367}
html[data-edition="zh"] .lang{color:#814d66;background:rgba(255,255,255,.44);border-color:rgba(121,69,94,.18)}
html[data-edition="zh"] #cards{animation-name:zhCards}
@keyframes zhDream{to{transform:translate3d(3%,-2%,0) scale(1.08)}}
@keyframes zhCards{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

/* 日本「あわい」：静けさ、余白、未说出口的距离 */
html[data-edition="ja"] #select{align-items:flex-start;justify-content:flex-start;padding-top:112px;background:
  linear-gradient(165deg,#e9e7e2 0%,#d8d9da 48%,#b9c0c5 100%)}
html[data-edition="ja"] #select::before{inset:0;background:
  linear-gradient(102deg,transparent 0 61%,rgba(255,255,255,.34) 61.2% 61.6%,transparent 61.8%),
  radial-gradient(ellipse at 82% 12%,rgba(255,255,255,.72),transparent 28%);animation:none}
html[data-edition="ja"] .title-noise{opacity:.08}
html[data-edition="ja"] .title-orbit{display:none}
html[data-edition="ja"] .brand{text-align:left;margin:0 0 25px 10px;animation:jaReveal 1.8s ease both}
html[data-edition="ja"] #select h1{font-size:.76em;font-weight:500;letter-spacing:.5em;color:#555a5d;text-shadow:none}
html[data-edition="ja"] .brand-local{font-size:2.8em;font-weight:300;letter-spacing:.3em;text-indent:0;margin-top:12px;color:#34383b}
html[data-edition="ja"] .pulse-line{width:150px;margin:17px 0 0}
html[data-edition="ja"] .pulse-line path{stroke:#7f777a;animation-duration:3.6s}
html[data-edition="ja"] .brand-category{text-align:left;text-indent:0;letter-spacing:.27em}
html[data-edition="ja"] #select .sub{align-self:flex-start;margin-left:10px;color:#606468;letter-spacing:.18em}
html[data-edition="ja"] #cards{align-self:center;gap:8px;animation:jaReveal 1.8s ease .35s both}
html[data-edition="ja"] .card{border-radius:2px;box-shadow:0 7px 22px rgba(45,50,54,.12);border-color:rgba(255,255,255,.35)}
html[data-edition="ja"] .lang{color:#43484c;background:rgba(255,255,255,.3);border-radius:2px}
@keyframes jaReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 西语 LATIDO：目光交锋、热度和戏剧张力 */
html[data-edition="es"] #select{background:
  linear-gradient(128deg,#19070e 0%,#731a32 54%,#d95b43 145%)}
html[data-edition="es"] #select::before{background:
  conic-gradient(from 210deg at 15% 100%,transparent,#f77f52 12%,transparent 24%),
  radial-gradient(circle at 84% 18%,rgba(255,150,94,.44),transparent 25%);animation:esHeat 8s ease-in-out infinite alternate}
html[data-edition="es"] .title-orbit{width:430px;top:-220px;right:-220px;border-width:2px;animation-duration:9s}
html[data-edition="es"] #select h1{font-size:1em;font-weight:700;letter-spacing:.55em;color:#ffd8c6}
html[data-edition="es"] .brand-local{font-size:2.55em;font-weight:800;letter-spacing:.1em;text-indent:.1em;color:#fff1e6}
html[data-edition="es"] .pulse-line path{stroke:#ff9b6f;animation-duration:1.35s}
html[data-edition="es"] .card{border-radius:13px;transform:skewX(-1.5deg)}
html[data-edition="es"] .card:active{transform:skewX(-1.5deg) scale(.97)}
@keyframes esHeat{to{transform:translate3d(-3%,2%,0) scale(1.12);filter:saturate(1.18)}}

/* 巴西 ENTRE NÓS：阳光、生命力和自然亲密 */
html[data-edition="pt-BR"] #select{background:
  radial-gradient(circle at 12% 3%,rgba(255,202,113,.5),transparent 25%),
  linear-gradient(148deg,#12382b 0%,#276550 50%,#153f4c 100%)}
html[data-edition="pt-BR"] #select::before{background:
  radial-gradient(circle at 15% 82%,rgba(242,166,90,.35),transparent 25%),
  radial-gradient(circle at 90% 25%,rgba(66,168,139,.34),transparent 28%);animation:ptSway 9s ease-in-out infinite alternate}
html[data-edition="pt-BR"] .title-orbit{width:360px;top:-150px;right:-150px;border-color:rgba(255,217,145,.28);animation-duration:13s}
html[data-edition="pt-BR"] #select h1{font-size:1em;font-weight:600;color:#ffe9bd}
html[data-edition="pt-BR"] .brand-local{font-size:2.15em;font-weight:650;letter-spacing:.08em;text-indent:.08em;color:#fff6df}
html[data-edition="pt-BR"] .pulse-line path{stroke:#ffc16f}
html[data-edition="pt-BR"] .card{border-radius:26px}
html[data-edition="pt-BR"] #cards{animation-name:ptCards}
@keyframes ptSway{to{transform:translate3d(4%,-2%,0) rotate(2deg) scale(1.08)}}
@keyframes ptCards{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.card{width:100%;height:clamp(250px,43vh,470px);border-radius:clamp(12px,2vw,24px);cursor:pointer;display:flex;align-items:flex-end;
  border:1px solid rgba(255,255,255,.24);box-shadow:0 22px 55px rgba(0,0,0,.3);transition:transform .55s cubic-bezier(.16,.8,.2,1),box-shadow .55s,filter .45s,opacity .45s;
  position:relative;overflow:hidden;isolation:isolate;transform-origin:50% 85%}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 18%,rgba(7,7,12,.12) 48%,rgba(8,5,10,.94) 100%)}
.card::after{content:"";position:absolute;inset:0;z-index:3;border:1px solid transparent;border-radius:inherit;transition:border-color .4s,box-shadow .4s;pointer-events:none}
.card:focus-visible{outline:2px solid var(--edition-glowA);outline-offset:5px}
.card:hover,.card:focus-visible{transform:translateY(-12px) rotateX(2deg) scale(1.025);box-shadow:0 32px 80px rgba(0,0,0,.44)}
.card:hover::after,.card:focus-visible::after{border-color:rgba(255,255,255,.48);box-shadow:inset 0 0 45px rgba(255,255,255,.08)}
#cards:has(.card:hover) .card:not(:hover){filter:saturate(.55) brightness(.7);transform:scale(.975)}
.card:active{transform:translateY(-4px) scale(.985)}
.card .por{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:top center;transition:transform 1s cubic-bezier(.16,.8,.2,1),filter .6s}
.card:hover .por,.card:focus-visible .por{transform:scale(1.075)}
.card .nm{font-size:clamp(1.25em,2.2vw,1.8em);font-weight:750;letter-spacing:.04em;color:#fff!important}
.card .ti{font-size:.82em;opacity:.76;margin-top:4px}
.card .tg{font-size:.68em;margin-top:9px;display:inline-block;padding:4px 9px;border-radius:2px;background:rgba(255,255,255,.12)}
.card .card-copy{min-width:0;flex:1;padding:26px 20px 22px;color:#fff;transform:translateY(8px);transition:transform .5s}
.card:hover .card-copy,.card:focus-visible .card-copy{transform:none}
.card .enter-cta{position:absolute;right:17px;bottom:18px;z-index:2;padding:8px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.34);background:rgba(18,10,16,.18);font-size:.66em;font-weight:800;
  letter-spacing:.05em;white-space:nowrap;backdrop-filter:blur(8px);opacity:0;transform:translateX(-8px);transition:.4s}
.card:hover .enter-cta,.card:focus-visible .enter-cta{background:rgba(255,255,255,.19);opacity:1;transform:none}
.card .hk{max-width:80%;opacity:0;transform:translateY(8px);transition:.45s}
.card:hover .hk,.card:focus-visible .hk{opacity:.78;transform:none}
html:not([data-edition="zh"]) .card{color:var(--edition-ink)}
html:not([data-edition="zh"]) .card .tg{background:rgba(255,255,255,.1)}
html:not([data-edition="zh"]) .card .hk{color:var(--edition-muted)}

@media (orientation:portrait),(max-width:700px){
  #select{justify-content:flex-start;padding-top:74px;overflow-y:auto}
  #select .brand{transform:scale(.84);transform-origin:center;margin-bottom:0}
  #select .sub{margin-top:4px;margin-bottom:2px}
  #cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;width:calc(100% + 36px);padding:4px 18px 24px;
    scrollbar-width:none}
  #cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 min(78vw,320px);height:min(47vh,430px);scroll-snap-align:center}
  .card .enter-cta{opacity:1;transform:none}
}
@media (orientation:landscape) and (min-width:701px){
  #select .brand{position:absolute;left:clamp(28px,5vw,80px);top:clamp(34px,7vh,72px);text-align:left}
  #select .brand .pulse-line{margin-left:0}
  #select .sub{position:absolute;left:clamp(28px,5vw,80px);top:clamp(205px,30vh,265px)}
  #cards{margin-top:clamp(105px,17vh,155px)}
  #opReplay{position:absolute;left:clamp(28px,5vw,80px);bottom:25px}
}

/* ---------- Full-screen wordmark interlude ---------- */
#launchGate{position:fixed;inset:0;z-index:190;display:none;place-items:center;overflow:hidden;color:var(--edition-ink);
  background:linear-gradient(145deg,var(--edition-bg0),var(--edition-bg1) 56%,var(--edition-bg2));font-family:var(--edition-font);cursor:pointer;isolation:isolate}
#launchGate.show{display:grid;animation:gateIn 1.1s ease both}
#launchGate.depart{animation:gateDepart .9s cubic-bezier(.65,0,.8,.3) both}
#launchGate::before{content:"";position:absolute;inset:-25%;z-index:-1;background:
  radial-gradient(circle at 28% 30%,color-mix(in srgb,var(--edition-glowA) 26%,transparent),transparent 28%),
  radial-gradient(circle at 75% 72%,color-mix(in srgb,var(--edition-glowB) 22%,transparent),transparent 32%);
  animation:titleAurora 10s ease-in-out infinite alternate}
.gate-inner{text-align:center;padding:8vw}
.gate-kicker{font-size:.64em;letter-spacing:.35em;opacity:.48;margin-bottom:20px}
.gate-title{font-size:clamp(3.2em,12vw,8.8em);font-weight:250;letter-spacing:.22em;text-indent:.22em}
.gate-pulse{width:min(230px,62vw);margin:0 auto 22px}
.gate-local{font-size:clamp(1em,3vw,2em);letter-spacing:.42em;text-indent:.42em;color:var(--edition-glowA);margin-top:10px}
.gate-category{margin-top:14px;font-size:clamp(.55em,1.15vw,.7em);font-weight:500;letter-spacing:.38em;text-indent:.38em;opacity:.66}
.gate-tagline{font-size:clamp(.72em,1.3vw,.92em);letter-spacing:.16em;opacity:.62;margin-top:28px}
.gate-prompt{position:absolute;bottom:clamp(28px,7vh,70px);font-size:.68em;letter-spacing:.22em;opacity:.65;animation:gatePrompt 1.8s ease-in-out infinite}
@keyframes gateIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}
@keyframes gateDepart{to{opacity:0;filter:blur(15px);transform:scale(1.08)}}
@keyframes gatePrompt{50%{opacity:.28;transform:translateY(3px)}}

/* ---------- EN editorial game introduction ---------- */
#brandIntro{position:fixed;inset:0;z-index:195;display:none;overflow:hidden;color:#f7efec;background:
  radial-gradient(ellipse at 24% 28%,rgba(126,38,67,.28),transparent 38%),
  radial-gradient(ellipse at 78% 72%,rgba(196,116,91,.17),transparent 36%),#160910;
  font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
#brandIntro.show{display:grid;place-items:center;animation:biIn .8s ease both}
#brandIntro.depart{animation:biOut .9s ease both}
html[data-edition="zh"] #brandIntro{color:#fff7fa;background:
  radial-gradient(circle at 72% 24%,rgba(255,214,229,.24),transparent 30%),
  radial-gradient(circle at 22% 74%,rgba(174,77,119,.34),transparent 38%),#321522;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif}
html[data-edition="ja"] #brandIntro{color:#ececeb;background:
  linear-gradient(105deg,transparent 0 67%,rgba(255,255,255,.08) 67.2% 67.5%,transparent 67.7%),
  radial-gradient(ellipse at 78% 18%,rgba(211,219,223,.18),transparent 33%),#222629;
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
html[data-edition="ja"] .bi-line{font-weight:300;letter-spacing:.13em}
html[data-edition="es"] #brandIntro{color:#fff2e9;background:
  linear-gradient(128deg,#19060d 0%,#681429 58%,#b94738 145%);
  font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
html[data-edition="es"] .bi-line{font-weight:650;letter-spacing:.055em;text-align:left;transform:skewX(-1.5deg)}
html[data-edition="pt-BR"] #brandIntro{color:#fff5dd;background:
  radial-gradient(circle at 14% 12%,rgba(247,182,91,.32),transparent 27%),
  radial-gradient(circle at 82% 78%,rgba(40,132,106,.35),transparent 35%),#10372e;
  font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif}
.bi-grain{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.bi-line{position:relative;width:min(820px,82vw);min-height:5em;display:grid;place-items:center;text-align:center;
  font-size:clamp(1.25rem,3.2vw,2.45rem);font-weight:350;line-height:1.55;letter-spacing:.07em;text-wrap:balance}
.bi-line span{display:block;animation:biWords 8s cubic-bezier(.2,.7,.2,1) both}
.bi-progress{position:absolute;left:9vw;right:9vw;bottom:9vh;height:1px;background:rgba(255,255,255,.12);overflow:hidden}
.bi-progress i{display:block;width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,#ca6d82,#e6b09f);animation:biProgress 120s linear both}
.bi-skip{position:absolute;right:4vw;top:4vh;z-index:2;border:0;background:transparent;color:rgba(255,255,255,.58);
  min-width:70px;min-height:44px;font:500 .7rem/1 inherit;letter-spacing:.18em;cursor:pointer}
.bi-theme{position:absolute;left:4vw;top:4vh;z-index:2;border:1px solid rgba(255,255,255,.18);border-radius:999px;
  background:rgba(255,255,255,.045);color:rgba(255,255,255,.66);padding:0 15px;min-height:40px;
  font:500 .66rem/1 inherit;letter-spacing:.13em;cursor:pointer;backdrop-filter:blur(10px)}
@keyframes biIn{from{opacity:0}to{opacity:1}}@keyframes biOut{to{opacity:0;filter:blur(9px)}}
@keyframes biWords{0%{opacity:0;transform:translateY(14px);filter:blur(7px)}15%,78%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
@keyframes biProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- 游戏画面 ---------- */
#game{position:absolute;inset:0;display:none;flex-direction:column}
#scene{position:absolute;inset:0;z-index:0;transition:background .8s}
.glow{position:absolute;border-radius:50%;filter:blur(50px);opacity:.5;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.petal{position:absolute;top:-30px;font-size:16px;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* 顶部HUD */
.hud{position:relative;z-index:5;padding:14px 16px 6px;display:flex;align-items:center;gap:10px}
.aff{flex:1}
.aff .lab{font-size:.7em;color:#7a5a66;display:flex;justify-content:space-between;margin-bottom:3px}
.bar{position:relative;height:13px;border-radius:8px;background:rgba(255,255,255,.5);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ffb3d1,var(--accent),#ff7eb3);background-size:200% 100%;animation:shimmer 3s linear infinite;transition:width .7s cubic-bezier(.22,1,.36,1)}
@keyframes shimmer{to{background-position:200% 0}}
.barglow{position:absolute;top:0;left:0;height:100%;width:0;border-radius:8px;pointer-events:none;box-shadow:0 0 14px 3px var(--accent);opacity:0;transition:opacity .3s}
.tier{font-weight:800;color:var(--accent);letter-spacing:.3px}
.tierpulse{animation:tierp .8s ease}@keyframes tierp{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes heartgain-rise{0%{opacity:0;transform:scale(.5) translateY(0)}10%{opacity:1;transform:scale(1.1) translateY(-40px)}100%{opacity:1;transform:scale(1) translateY(calc(-100vh + 140px))}}
.heartgain{position:fixed;z-index:9999;pointer-events:auto;cursor:pointer;font-weight:900;text-shadow:0 3px 12px rgba(255,60,120,.6),0 0 20px rgba(255,120,170,.4);animation:heartgain-rise 1.2s cubic-bezier(.2,.7,.3,1) forwards;will-change:opacity,transform;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:24px;border:2px solid rgba(255,120,170,.5)}
.mood{font-size:1.5em;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}

/* 立绘 */
.stage{position:relative;z-index:4;flex:0 0 auto;height:38vh;display:flex;align-items:center;justify-content:center;min-height:0}
.portrait{width:210px;height:290px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:4.6em;
  background-color:rgba(255,255,255,.25);background-size:cover;background-position:top center;
  box-shadow:0 0 0 4px rgba(255,255,255,.4),0 0 44px 6px var(--accent),0 16px 44px rgba(0,0,0,.28);
  animation:bob 4.5s ease-in-out infinite;transition:filter .6s ease,box-shadow .6s ease}
.portrait[data-mood="smile"]{filter:brightness(1.035) saturate(1.03)}
.portrait[data-mood="blush"]{filter:brightness(1.05) saturate(1.08) sepia(.025)}
.portrait[data-mood="love"]{filter:brightness(1.06) saturate(1.1);box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 64px 12px var(--accent),0 18px 48px rgba(0,0,0,.3)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pet{position:absolute;bottom:6px;left:14px;z-index:4;font-size:2em;animation:bob 3.4s ease-in-out infinite}

/* 对话框 VN */
.chatlog{position:relative;z-index:6;margin:0 12px 8px;padding:4px 4px;overflow-y:auto;flex:1 1 auto;min-height:80px;
  display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chatlog::-webkit-scrollbar{width:4px}.chatlog::-webkit-scrollbar-thumb{background:rgba(150,90,120,.25);border-radius:4px}
.msg{max-width:78%;padding:9px 14px;border-radius:16px;font-size:1.02em;line-height:1.5;word-wrap:break-word;
  animation:msgin .3s ease;box-shadow:0 2px 8px rgba(150,90,120,.12)}
.msg.them{align-self:flex-start;background:rgba(255,255,255,.9);color:#3a2b33;border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.them strong{color:#2a1d24}.msg.them em{font-style:italic;color:#6b4a5a}
.msg.ev{align-self:center;max-width:88%;background:rgba(120,80,100,.14);color:#6b4a5a;font-style:italic;font-size:.94em;text-align:center;box-shadow:none}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dbox{position:relative;z-index:6;margin:0 12px 10px;padding:16px 18px 14px;border-radius:20px;min-height:120px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(10px);box-shadow:0 -4px 24px rgba(150,90,120,.18)}
.name{position:absolute;top:-14px;left:18px;background:var(--accent);color:#fff;font-weight:800;font-size:.9em;padding:4px 16px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.line{font-size:1.08em;line-height:1.6;min-height:52px;color:#3a2b33}
.line strong{font-weight:700;color:#2a1d24}
.line em{font-style:italic;color:#6b4a5a}
.line code{font-family:ui-monospace,monospace;font-size:.92em;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
.cursor{display:inline-block;width:7px;background:var(--accent);margin-left:1px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.inrow{display:flex;gap:8px;margin-top:12px}
#inp{flex:1;min-width:0;min-height:44px;background:#fff;border:1.5px solid #f2d3de;border-radius:22px;padding:11px 16px;font-size:1em;font-family:inherit;outline:none}
#inp:focus{border-color:var(--accent)}
#send{background:linear-gradient(135deg,#f4cfa6,var(--accent) 70%);border:0;border-radius:22px;padding:0 18px;min-width:56px;min-height:44px;color:#fff;font-size:1em;font-weight:700;letter-spacing:1px;cursor:pointer;transition:transform .12s;box-shadow:0 3px 10px rgba(232,122,168,.35),inset 0 1px 0 rgba(255,255,255,.45)}
#send:active{transform:scale(.9)}#send:disabled{opacity:.45}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts{display:flex;gap:8px;justify-content:space-around;margin-top:10px;padding:6px 0}
.act{cursor:pointer;font-size:1.55em;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,120,170,.25);transition:transform .15s ease,background .2s ease;user-select:none;position:relative}
.act:active{transform:scale(.88)}
.act:hover{background:rgba(255,120,170,.15)}
.act .lbl{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:.5em;color:var(--muted);white-space:nowrap;opacity:.75}
.chip{font-size:.78em;padding:5px 13px;min-height:38px;display:inline-flex;align-items:center;border-radius:19px;background:rgba(255,255,255,.7);border:1px solid #f2d3de;cursor:pointer;color:#a85f7e}

/* 里程碑弹幕 */
.ms{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,225,235,.55);backdrop-filter:blur(3px)}
.ms .big{font-size:2.6em;font-weight:900;color:#c9527e;text-shadow:0 3px 16px rgba(232,122,168,.5);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.burst{position:absolute;font-size:1.6em;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.back{position:absolute;top:12px;left:12px;z-index:8;background:rgba(255,255,255,.55);border:0;border-radius:20px;padding:5px 12px;min-height:44px;min-width:44px;font-size:1em;cursor:pointer}
.card .hk{font-size:.76em;margin-top:6px;color:#a8798d;font-style:italic;line-height:1.4}
@media (prefers-reduced-motion:reduce){
  .title-orbit,#select::before,.pulse-line path{animation:none}
  .pulse-line path{stroke-dashoffset:0}
  .brand,#select .sub,#cards{animation-duration:.01ms;animation-delay:0s}
}

/* ---------- 序幕 Prologue ---------- */
#prologueOv{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(170deg,rgba(24,16,34,.9),rgba(46,22,44,.88) 55%,rgba(20,14,30,.92));backdrop-filter:blur(8px)}
#prologueOv.show{display:flex}
.plg-card{width:100%;max-width:420px;border-radius:18px;padding:34px 28px 30px;text-align:center;position:relative;
  background:linear-gradient(165deg,rgba(56,32,52,.92),rgba(38,24,44,.94));
  border:1px solid rgba(233,180,160,.28);box-shadow:0 0 60px rgba(232,122,168,.22),0 24px 60px rgba(0,0,0,.5)}
.plg-card::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%,rgba(240,180,190,.12),transparent 70%)}
.plg-star{font-size:1.5em;margin-bottom:14px;opacity:0;animation:plgIn 1.2s ease forwards .2s}
.plg-p{color:#f3dde2;font-size:.98em;line-height:1.85;margin:0 0 16px;opacity:0;animation:plgIn 1.2s ease forwards;letter-spacing:.4px}
.plg-p.names{color:#eec9a8;font-size:.9em;letter-spacing:1px}
.plg-p:nth-of-type(1){animation-delay:.5s}.plg-p:nth-of-type(2){animation-delay:1.6s}
.plg-p:nth-of-type(3){animation-delay:3s}.plg-p:nth-of-type(4){animation-delay:4s}
@keyframes plgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.plg-btn{margin-top:10px;padding:12px 38px;border:0;border-radius:26px;cursor:pointer;font-size:1em;font-weight:700;letter-spacing:2px;
  color:#4a2c38;background:linear-gradient(135deg,#f4cfa6,#eda9bd 60%,#e78ab0);
  box-shadow:0 6px 22px rgba(232,122,168,.4),inset 0 1px 0 rgba(255,255,255,.5);
  opacity:0;animation:plgIn 1.2s ease forwards 4.9s;transition:transform .15s}
.plg-btn:active{transform:scale(.95)}
.plg-card.fast .plg-star,.plg-card.fast .plg-p,.plg-card.fast .plg-btn{animation-delay:0s;animation-duration:.4s}
.help{position:absolute;top:12px;right:88px;z-index:30;width:44px;height:44px;background:rgba(255,255,255,.55);border:0;border-radius:50%;font-size:.85em;cursor:pointer;backdrop-filter:blur(6px);color:#a85f7e;font-weight:800}

/* ---------- 反馈 Feedback ---------- */
.fbbtn{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:60;height:31px;padding:0 12px;
  background:color-mix(in srgb,var(--edition-bg0) 52%,transparent);border:1px solid color-mix(in srgb,var(--edition-glowA) 34%,transparent);
  border-radius:4px;font:500 .68em/1 var(--edition-font);letter-spacing:.1em;cursor:pointer;color:var(--edition-ink);
  box-shadow:0 5px 18px color-mix(in srgb,var(--edition-bg0) 24%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:6px;opacity:.68;
  transition:opacity .2s,background .2s,transform .15s}
.fbbtn::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--edition-glowA);box-shadow:0 0 8px var(--edition-glowA)}
.fbbtn:hover{opacity:1;background:color-mix(in srgb,var(--edition-bg0) 72%,transparent)}
.fbbtn:active{transform:translateX(-50%) scale(.94)}
#fbOv{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(60,35,50,.35);backdrop-filter:blur(4px)}
#fbOv.show{display:flex}
.fb-card{width:100%;max-width:340px;border-radius:20px;padding:24px 22px 20px;text-align:center;position:relative;
  color:var(--edition-ink);background:linear-gradient(155deg,color-mix(in srgb,var(--edition-bg1) 94%,#fff 6%),var(--edition-bg0));
  border:1px solid color-mix(in srgb,var(--edition-glowA) 30%,transparent);box-shadow:0 18px 54px color-mix(in srgb,var(--edition-bg0) 55%,transparent)}
.fb-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--edition-muted);font-size:1.1em;cursor:pointer}
.fb-q{font-weight:600;color:var(--edition-ink);font-size:1.02em;margin-bottom:14px;letter-spacing:.05em}
.fb-emos{display:flex;justify-content:center;gap:18px;margin-bottom:14px}
.fb-emo{font-size:2em;background:rgba(255,255,255,.65);border:2px solid transparent;border-radius:50%;width:58px;height:58px;cursor:pointer;transition:transform .15s,border-color .15s}
.fb-emo:active{transform:scale(.9)}
.fb-emo.sel{border-color:var(--edition-glowA);background:rgba(255,255,255,.92);box-shadow:0 4px 14px color-mix(in srgb,var(--edition-glowA) 30%,transparent)}
.fb-note{width:100%;border:1px solid color-mix(in srgb,var(--edition-glowA) 34%,transparent);border-radius:8px;padding:10px 12px;font-size:.9em;font-family:inherit;outline:none;
  background:rgba(255,255,255,.1);resize:none;color:var(--edition-ink)}
.fb-note::placeholder{color:var(--edition-muted)}.fb-note:focus{border-color:var(--edition-glowA)}
.fb-send{margin-top:12px;padding:10px 34px;border:0;border-radius:22px;cursor:pointer;font-weight:700;letter-spacing:1px;color:#fff;
  background:linear-gradient(135deg,var(--edition-glowA),var(--edition-glowB));box-shadow:0 5px 16px color-mix(in srgb,var(--edition-bg0) 35%,transparent)}
.fb-send:disabled{opacity:.45}
.fb-done{color:var(--edition-ink);font-weight:700;font-size:1.15em;padding:26px 0;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#fbBar{position:fixed;left:50%;bottom:-90px;transform:translateX(-50%);z-index:65;width:calc(100% - 32px);max-width:420px;
  border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(150deg,#fff4f0,#ffe8ee);border:1px solid rgba(233,180,190,.55);
  box-shadow:0 10px 30px rgba(180,110,140,.35);transition:bottom .6s cubic-bezier(.22,1,.36,1)}
#fbBar.show{bottom:16px}
#fbBar .fb-q{margin:0;flex:1;text-align:left;font-size:.88em}
#fbBar .fb-emo{width:42px;height:42px;font-size:1.35em}
html[data-edition="zh"] .fbbtn{border-radius:16px;background:rgba(255,250,252,.38);color:#7c3f5c}
html[data-edition="ja"] .fbbtn,html[data-edition="ja"] .fb-card,html[data-edition="ja"] .fb-note{border-radius:2px}
html[data-edition="es"] .fbbtn{transform:translateX(-50%) skewX(-3deg);border-radius:3px}
html[data-edition="es"] .fbbtn:active{transform:translateX(-50%) skewX(-3deg) scale(.94)}
html[data-edition="pt-BR"] .fbbtn{border-radius:18px}

/* ---------- 故事线 Story ---------- */
.chap{position:relative;z-index:7;margin:4px 14px 8px;padding:10px 13px;font-size:.76em;color:var(--edition-ink);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--edition-glowA) 28%,transparent);
  border-radius:14px;background:color-mix(in srgb,var(--edition-bg0) 72%,transparent);backdrop-filter:blur(14px);
  box-shadow:0 8px 28px rgba(0,0,0,.1)}
.chap .ci{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-weight:700;font-size:.9em}
.chap .cg{flex-basis:100%;background:transparent;color:var(--edition-ink);padding:3px 1px 0;font-weight:650;font-size:1.05em;line-height:1.45}
.chap .cg::before{content:attr(data-label);display:block;margin-bottom:2px;color:var(--edition-glowA);font-size:.72em;letter-spacing:.12em}
.chapter-map{flex-basis:100%;display:flex;align-items:center;gap:5px;padding-top:5px}
.chapter-map i{display:block;flex:1;height:2px;border-radius:2px;background:color-mix(in srgb,var(--edition-ink) 13%,transparent)}
.chapter-map i.done{background:color-mix(in srgb,var(--edition-glowA) 55%,transparent)}
.chapter-map i.current{height:4px;background:var(--edition-glowA);box-shadow:0 0 10px color-mix(in srgb,var(--edition-glowA) 65%,transparent)}
.chapter-wish{position:fixed;inset:0;z-index:88;display:none;place-items:center;overflow:hidden;padding:8vw;text-align:center;
  color:var(--edition-ink);background:linear-gradient(145deg,var(--edition-bg0),var(--edition-bg1) 58%,var(--edition-bg2));
  font-family:var(--edition-font);isolation:isolate;cursor:pointer}
.chapter-wish.show{display:grid;animation:wishIn .75s ease both}
.chapter-wish.collapse{animation:wishCollapse .9s cubic-bezier(.65,0,.78,.3) both}
.chapter-wish::before{content:"";position:absolute;inset:-20%;z-index:-1;background:
  radial-gradient(circle at 25% 25%,color-mix(in srgb,var(--edition-glowA) 25%,transparent),transparent 30%),
  radial-gradient(circle at 76% 72%,color-mix(in srgb,var(--edition-glowB) 22%,transparent),transparent 34%);
  animation:titleAurora 9s ease-in-out infinite alternate}
.wish-inner{width:min(760px,86vw)}
.wish-kicker{font-size:.66em;letter-spacing:.28em;color:var(--edition-glowA);margin-bottom:22px}
.wish-title{font-size:clamp(.82em,1.5vw,1.05em);letter-spacing:.14em;opacity:.55;margin-bottom:24px}
.wish-text{font-size:clamp(1.45em,4.5vw,3.2em);font-weight:350;line-height:1.55;text-wrap:balance}
.wish-line{width:min(230px,58vw);height:1px;margin:34px auto 0;background:linear-gradient(90deg,transparent,var(--edition-glowA),transparent)}
.wish-skip{position:absolute;right:4vw;top:4vh;border:0;background:transparent;color:inherit;opacity:.48;
  min-width:68px;min-height:44px;font:500 .68em/1 inherit;letter-spacing:.15em;cursor:pointer}
html[data-edition="zh"] .chapter-wish{background:radial-gradient(circle at 50% 18%,rgba(255,249,252,.72),transparent 28%),linear-gradient(150deg,#f5dce6,#d9aec2 58%,#bc91b6)}
html[data-edition="ja"] .chapter-wish{background:linear-gradient(165deg,#e6e4df,#c9cdd0);color:#3f4447}
html[data-edition="ja"] .wish-text{font-weight:300;letter-spacing:.1em}
html[data-edition="es"] .chapter-wish{background:linear-gradient(128deg,#1c070e,#71182e 58%,#c54d3d);color:#fff0e8}
html[data-edition="es"] .wish-inner{transform:skewX(-1.5deg)}
html[data-edition="es"] .wish-text{font-weight:700;text-align:left}
html[data-edition="pt-BR"] .chapter-wish{background:radial-gradient(circle at 17% 12%,rgba(255,195,100,.38),transparent 28%),linear-gradient(150deg,#174638,#27664f 58%,#18414a);color:#fff5dc}
@keyframes wishIn{from{opacity:0;filter:blur(9px)}to{opacity:1;filter:none}}
@keyframes wishCollapse{to{opacity:0;transform:translateY(-34vh) scale(.16);filter:blur(5px)}}
/* 剧情事件 beat 卡 */
.beat{position:relative;z-index:6;margin:6px 12px 0;padding:10px 14px;border-radius:14px;font-size:.92em;line-height:1.55;color:#5a3a48;
  background:linear-gradient(135deg,rgba(255,240,246,.92),rgba(255,232,220,.9));border:1px solid rgba(233,180,190,.5);
  box-shadow:0 3px 14px rgba(180,110,140,.16);animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.beat::before{content:"◈";color:var(--accent);margin-right:6px}
/* 章末抉择 choice */
.choiceOv{position:absolute;inset:0;z-index:16;display:none;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(170deg,rgba(30,18,32,.72),rgba(46,22,44,.7));backdrop-filter:blur(5px)}
.choiceOv.show{display:flex}
.choiceCard{width:100%;max-width:400px;border-radius:20px;padding:24px 20px;text-align:center;
  background:linear-gradient(160deg,rgba(58,34,52,.96),rgba(40,24,44,.97));border:1px solid rgba(233,180,160,.3);
  box-shadow:0 0 50px rgba(232,122,168,.25),0 20px 50px rgba(0,0,0,.5)}

/* 结局 ending */

.endOv.show{display:flex}
.endCard{width:100%;max-width:440px;border-radius:18px;padding:36px 28px 30px;text-align:center;

  box-shadow:0 0 70px rgba(232,122,168,.28),0 24px 60px rgba(0,0,0,.55)}
.endCard .etag{font-size:.78em;letter-spacing:3px;color:#eec9a8;opacity:.85;margin-bottom:10px}

.endCard .ebtn{padding:12px 34px;border:0;border-radius:24px;cursor:pointer;font-weight:700;letter-spacing:1px;color:#4a2c38;
  background:linear-gradient(135deg,#f4cfa6,#e78ab0)}
.clearOv,.archiveOv{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;padding:22px;
  background:color-mix(in srgb,var(--edition-bg0) 78%,transparent);backdrop-filter:blur(14px)}
.clearOv.show,.archiveOv.show{display:flex}.clearCard,.archiveCard{width:100%;max-width:440px;max-height:84vh;overflow:auto;padding:30px 26px;border-radius:22px;
  color:var(--edition-ink);background:linear-gradient(155deg,var(--edition-bg1),var(--edition-bg0));border:1px solid color-mix(in srgb,var(--edition-glowA) 38%,transparent);
  box-shadow:0 24px 80px rgba(0,0,0,.46);text-align:center}
.clearKicker{font-size:.68em;letter-spacing:.24em;color:var(--edition-glowA)}.clearTitle{font-size:1.55em;margin:12px 0 18px}
.rewardCard{padding:18px;border:1px solid color-mix(in srgb,var(--edition-glowA) 32%,transparent);border-radius:16px;background:rgba(255,255,255,.07);text-align:left}
.rewardKind{font-size:.65em;letter-spacing:.18em;color:var(--edition-glowA)}.rewardText{margin-top:10px;line-height:1.7;color:var(--edition-muted)}
.clearNext,.archiveClose{margin-top:20px;padding:12px 28px;border:0;border-radius:999px;cursor:pointer;font:700 .85em var(--edition-font);color:var(--edition-bg0);background:var(--edition-glowA)}
.archiveBtn{position:absolute;left:14px;bottom:14px;z-index:55;border:1px solid color-mix(in srgb,var(--edition-glowA) 35%,transparent);border-radius:999px;padding:9px 13px;
  color:var(--edition-ink);background:color-mix(in srgb,var(--edition-bg0) 58%,transparent);backdrop-filter:blur(12px);cursor:pointer;font:600 .68em var(--edition-font);letter-spacing:.08em}
.xpromo{position:absolute;right:14px;bottom:14px;z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:58%}
.xpromo a{text-decoration:none;border:1px solid color-mix(in srgb,var(--edition-glowA) 35%,transparent);border-radius:999px;padding:8px 12px;color:var(--edition-ink);background:color-mix(in srgb,var(--edition-bg0) 58%,transparent);backdrop-filter:blur(12px);font:600 .62em var(--edition-font);letter-spacing:.06em}
.archiveGrid{display:grid;gap:10px;text-align:left;margin-top:18px}.archiveItem{padding:13px;border-left:2px solid var(--edition-glowA);background:rgba(255,255,255,.06)}
.archiveEmpty{padding:34px 0;color:var(--edition-muted)}.routeProgress{position:absolute;top:14px;right:14px;z-index:4;padding:5px 9px;border-radius:999px;
  background:rgba(8,5,10,.56);color:#fff;font-size:.64em;letter-spacing:.06em;backdrop-filter:blur(8px)}
/* 依恋类型指示(HUD 内, 极简) */
.attach{font-size:1.05em;cursor:default}

/* ---------- In-game Edition language ---------- */
html[data-edition="en"] .dbox{background:rgba(35,14,24,.84);border:1px solid rgba(229,177,164,.15);box-shadow:0 -8px 34px rgba(20,4,10,.38)}
html[data-edition="en"] .line{color:#f3ece8}
html[data-edition="en"] .portrait{border-radius:10px;box-shadow:0 0 0 1px rgba(229,177,164,.3),0 20px 54px rgba(30,5,14,.46)}
html[data-edition="en"] #inp{background:rgba(255,244,240,.09);border-color:rgba(229,177,164,.22);color:#fff}
html[data-edition="en"] #inp::placeholder{color:rgba(255,255,255,.48)}

html[data-edition="zh"] .portrait{border-radius:25px;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 48px 7px var(--accent),0 16px 44px rgba(80,34,58,.22)}
html[data-edition="zh"] .dbox{background:rgba(255,250,252,.88);box-shadow:0 -5px 28px rgba(181,91,132,.2)}

html[data-edition="ja"] .portrait{border-radius:2px;box-shadow:12px 14px 0 rgba(255,255,255,.18),0 20px 42px rgba(25,30,34,.25)}
html[data-edition="ja"] .dbox{border-radius:2px;background:rgba(239,238,233,.9);box-shadow:0 -1px 0 rgba(50,55,58,.16)}
html[data-edition="ja"] .name{border-radius:0;background:#555b60;font-weight:500;letter-spacing:.15em}
html[data-edition="ja"] #inp{border-radius:2px;border:0;border-bottom:1px solid #9ca0a2;background:rgba(255,255,255,.42)}
html[data-edition="ja"] #send{border-radius:2px;background:#6f777c;box-shadow:none}
html[data-edition="ja"] .chip{border-radius:2px;background:rgba(255,255,255,.45);border-color:rgba(60,65,68,.18);color:#555b60}

html[data-edition="es"] .portrait{border-radius:8px;box-shadow:-12px 12px 0 rgba(255,139,95,.18),0 18px 54px rgba(35,6,16,.42)}
html[data-edition="es"] .dbox{border-radius:14px;background:rgba(48,15,29,.88);border-left:3px solid #ff9166;box-shadow:0 -8px 32px rgba(50,5,20,.32)}
html[data-edition="es"] .line{color:#fff0e8}
html[data-edition="es"] #inp{background:rgba(255,255,255,.1);border-color:rgba(255,179,142,.3);color:#fff}
html[data-edition="es"] #inp::placeholder{color:rgba(255,255,255,.5)}

html[data-edition="pt-BR"] .portrait{border-radius:30px;box-shadow:0 0 0 3px rgba(255,232,184,.45),0 18px 50px rgba(8,48,38,.34)}
html[data-edition="pt-BR"] .dbox{border-radius:28px;background:rgba(246,244,226,.9);box-shadow:0 -8px 32px rgba(15,70,55,.22)}
html[data-edition="pt-BR"] .name{background:#29735a}
html[data-edition="pt-BR"] #send{background:linear-gradient(135deg,#f2a65a,#2e8d70)}

/* ---------- Edition-specific in-game direction ---------- */
#game[data-portrait-mode="scene"] .stage{margin:4px 14px 8px;height:34vh}
#game[data-portrait-mode="scene"] .portrait{width:100%;height:100%;max-width:none;background-size:cover;background-position:center;border-radius:16px;font-size:0}
#game[data-portrait-mode="scene"] .pet{bottom:-8px}

/* EN — full-bleed streaming drama, asymmetrical and restrained */
html[data-edition="en"] #game .hud{padding:18px 18px 8px}
html[data-edition="en"] #game .stage{height:42vh;justify-content:flex-end;padding-right:14px}
html[data-edition="en"] #game:not([data-portrait-mode="scene"]) .portrait{width:min(66vw,255px);height:100%;border-radius:7px;background-position:center top}
html[data-edition="en"] #game .chatlog{margin:0 14px 6px}
html[data-edition="en"] #game .msg.them{background:rgba(30,12,21,.84);color:#f6ebe7;border:1px solid rgba(216,155,137,.15);border-radius:4px 14px 14px 4px}
html[data-edition="en"] #game .msg.me{background:#7c2c48;border-radius:14px 4px 4px 14px}
html[data-edition="en"] #game .dbox{margin:0 10px 10px;border-radius:7px}
html[data-edition="en"] #game .chap{letter-spacing:.06em;text-transform:uppercase}

/* ZH — central romantic stage, soft layering and visible emotional reward */
html[data-edition="zh"] #game .stage{height:39vh}
html[data-edition="zh"] #game .hud{padding-top:16px}
html[data-edition="zh"] #game .msg.them{border-radius:18px 18px 18px 5px}
html[data-edition="zh"] #game .msg.me{border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,#d95d8d,var(--accent))}
html[data-edition="zh"] #game .dbox{border-radius:24px}
html[data-edition="zh"] #game .beat{border-radius:18px;background:linear-gradient(135deg,rgba(255,247,250,.95),rgba(250,224,233,.92))}

/* JA — the environment leads; quiet editorial panels and deliberate whitespace */
html[data-edition="ja"] #game .hud{padding:18px 20px 10px;border-bottom:1px solid rgba(55,60,63,.12)}
html[data-edition="ja"] #game .stage{height:28vh;margin-top:12px;align-items:stretch}
html[data-edition="ja"] #game[data-portrait-mode="scene"] .stage{height:30vh;margin:12px 18px 14px;padding:0}
html[data-edition="ja"] #game[data-portrait-mode="scene"] .portrait{border-radius:0;background-position:center;filter:saturate(.52) contrast(.92)}
html[data-edition="ja"] #game .chatlog{margin:0 20px 10px;gap:12px}
html[data-edition="ja"] #game .msg{box-shadow:none;line-height:1.72;font-size:.95em}
html[data-edition="ja"] #game .msg.them{background:rgba(244,243,239,.82);border-radius:0;border-left:1px solid #7f8589;padding-left:16px}
html[data-edition="ja"] #game .msg.me{background:transparent;color:#3f4548;border-radius:0;border-right:1px solid #7f8589;text-align:right;padding-right:16px}
html[data-edition="ja"] #game .dbox{margin:0 18px 14px;padding:18px 16px 12px}
html[data-edition="ja"] #game .chap{margin:2px 20px;color:#5b6266}
html[data-edition="ja"] #game .chap .ci{border-radius:0;background:#666e73}
html[data-edition="ja"] #game .chap .cg{border-radius:0;background:transparent;border-left:1px solid #8d9497}
html[data-edition="ja"] #game .pet,html[data-edition="ja"] #game .particles{display:none}

/* ES — diagonal stage, sharp conversational rhythm and opposing message blocks */
html[data-edition="es"] #game .hud{padding:16px 16px 6px}
html[data-edition="es"] #game .stage{height:39vh;justify-content:flex-start;padding-left:10px;overflow:hidden}
html[data-edition="es"] #game:not([data-portrait-mode="scene"]) .portrait{width:78%;height:100%;border-radius:0;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
html[data-edition="es"] #game[data-portrait-mode="scene"] .stage{height:35vh;margin-left:8px;margin-right:8px;transform:skewX(-1.5deg)}
html[data-edition="es"] #game[data-portrait-mode="scene"] .portrait{border-radius:2px;background-position:42% center}
html[data-edition="es"] #game .chatlog{gap:6px}
html[data-edition="es"] #game .msg{border-radius:2px;font-weight:500}
html[data-edition="es"] #game .msg.them{background:rgba(48,12,25,.86);color:#fff0e8;border-left:3px solid #ef7b55}
html[data-edition="es"] #game .msg.me{background:#b4384f;border-right:3px solid #ffb06e}
html[data-edition="es"] #game .dbox{margin-left:8px;margin-right:8px}
html[data-edition="es"] #game .chap .ci,html[data-edition="es"] #game .chap .cg{border-radius:2px}

/* PT-BR — open, rounded, tactile and socially warm */
html[data-edition="pt-BR"] #game .hud{padding:17px 18px 7px}
html[data-edition="pt-BR"] #game .stage{height:36vh}
html[data-edition="pt-BR"] #game:not([data-portrait-mode="scene"]) .portrait{width:min(72vw,270px);height:100%;border-radius:48% 48% 24px 24px}
html[data-edition="pt-BR"] #game[data-portrait-mode="scene"] .stage{height:34vh;margin:6px 12px 10px}
html[data-edition="pt-BR"] #game[data-portrait-mode="scene"] .portrait{border-radius:34px;background-position:center 48%}
html[data-edition="pt-BR"] #game .chatlog{gap:9px}
html[data-edition="pt-BR"] #game .msg.them{background:rgba(248,244,221,.92);border-radius:22px 22px 22px 7px;color:#284b3e}
html[data-edition="pt-BR"] #game .msg.me{background:#2f8468;border-radius:22px 22px 7px 22px}
html[data-edition="pt-BR"] #game .dbox{margin-left:10px;margin-right:10px}
html[data-edition="pt-BR"] #game .chip{background:rgba(255,248,222,.75);border-color:rgba(47,132,104,.22);color:#286d59}

/* ---------- Opening Director ---------- */
#opening{position:fixed;inset:0;z-index:200;display:none;overflow:hidden;color:#fff;background:#100a0e;font-family:var(--edition-font)}
#opening.show{display:block}
.op-skip{position:absolute;z-index:8;right:18px;top:17px;border:0;background:transparent;color:currentColor;opacity:.58;
  font:500 .72em/1 var(--edition-font);letter-spacing:.14em;min-width:52px;min-height:40px;cursor:pointer}
.op-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:opCut .7s cubic-bezier(.2,.75,.25,1) both}
.op-caption{position:relative;z-index:3;width:min(82%,390px)}
.op-eyebrow{font-size:.64em;letter-spacing:.24em;opacity:.55;margin-bottom:14px}
.op-text{font-size:clamp(1.25em,6vw,1.85em);line-height:1.45;letter-spacing:.025em;white-space:normal}
.op-world{position:absolute;inset:0;overflow:hidden}
.op-world i{position:absolute;display:block}
.op-scene-image{position:absolute;inset:-4%;background-image:var(--op-scene);background-size:cover;background-position:center;background-repeat:no-repeat;
  transform-origin:center;animation:opSceneIn 2.4s cubic-bezier(.18,.72,.22,1) both}
.op-character{position:absolute;inset:0;background-image:var(--op-image);background-repeat:no-repeat;pointer-events:none}
.op-wordmark{font-size:clamp(2.7em,14vw,4.5em);font-weight:300;letter-spacing:.2em;text-indent:.2em;animation:opLogo 1.1s ease both}
.op-local{text-align:center;font-size:1.15em;letter-spacing:.38em;text-indent:.38em;margin-top:9px;animation:opLogo 1s ease .22s both}
.op-category{text-align:center;font-size:clamp(.52em,1.4vw,.66em);font-weight:500;letter-spacing:.38em;text-indent:.38em;
  opacity:.66;margin-top:15px;animation:opLogo 1s ease .34s both}
.op-tagline{text-align:center;font-size:.72em;letter-spacing:.13em;opacity:.62;margin-top:24px;animation:opLogo 1s ease .4s both}
.op-heartline{width:min(230px,62vw);height:20px;margin:0 auto 18px}
.op-brand{flex-direction:column}
@keyframes opCut{from{opacity:0;filter:blur(8px);transform:scale(1.025)}to{opacity:1;filter:none;transform:none}}
@keyframes opLogo{from{opacity:0;letter-spacing:.36em;filter:blur(5px)}to{opacity:1;filter:none}}
@keyframes opBeat{0%{transform:scale(.4);opacity:.2}35%{transform:scale(1.9);opacity:1}100%{transform:scale(.7);opacity:.55}}
@keyframes opSceneIn{from{opacity:.35;transform:scale(1.09);filter:blur(5px)}to{opacity:1;transform:scale(1.025);filter:none}}

/* EN: close, controlled, adult */
#opening[data-opening="en"]{background:linear-gradient(150deg,#10070c,#491426 58%,#1d0d16);color:#f7eae5}
#opening[data-opening="en"] .op-caption{text-align:left}
#opening[data-opening="en"] .op-scene-image{background-position:58% center;filter:saturate(.82) contrast(1.06)}
#opening[data-opening="en"] .op-message .op-scene-image{background-position:74% 88%;animation-name:enSceneCoffee}
#opening[data-opening="en"] .op-gaze .op-scene-image{background-position:65% 35%;animation-name:enSceneGaze}
#opening[data-opening="en"] .op-dawn .op-world::before{content:"";position:absolute;inset:-20%;background:linear-gradient(112deg,transparent 38%,rgba(224,157,130,.34) 49%,transparent 57%);animation:enLight 2.4s ease both}
#opening[data-opening="en"] .op-character{width:86%;left:auto;background-size:cover;background-position:center 12%;filter:saturate(.58) contrast(1.09) sepia(.12);
  -webkit-mask-image:linear-gradient(to left,#000 58%,rgba(0,0,0,.78) 75%,transparent 100%),linear-gradient(to top,transparent 0,#000 24%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 58%,rgba(0,0,0,.78) 75%,transparent 100%);
  transform-origin:65% 35%;animation:enCamera 2.2s cubic-bezier(.2,.7,.25,1) both}
#opening[data-opening="en"] .op-frame:not(.op-brand)::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:
  linear-gradient(90deg,rgba(15,5,10,.93) 0%,rgba(30,7,16,.65) 37%,transparent 70%),
  linear-gradient(0deg,rgba(20,5,11,.72),transparent 42%);mix-blend-mode:multiply}
#opening[data-opening="en"] .op-brand>div{position:relative;z-index:2}
#opening[data-opening="en"] .op-caption{z-index:3;width:56%;margin-left:7%;margin-right:auto}
#opening[data-opening="en"] .op-dawn .op-character{width:94%;right:-18%;background-position:58% 16%;filter:saturate(.48) contrast(1.12) sepia(.2) brightness(.72)}
#opening[data-opening="en"] .op-message .op-character{width:84%;right:-11%;background-position:55% 10%;animation-name:enSlide}
#opening[data-opening="en"] .op-message .op-caption{padding:22px;border-left:1px solid rgba(229,177,164,.55);background:rgba(20,6,12,.34);backdrop-filter:blur(10px)}
#opening[data-opening="en"] .op-gaze .op-character{width:93%;right:-12%;background-position:50% 7%;filter:saturate(.46) contrast(1.12) sepia(.16) brightness(.8);animation-name:enGaze}
#opening[data-opening="en"] .op-gaze .op-caption{align-self:flex-end;margin-bottom:18vh;width:78%;text-align:right;text-shadow:0 4px 22px #19060e}
#opening[data-opening="en"] .op-gaze .op-world::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 29%,rgba(221,154,129,.24),transparent 25%)}
@keyframes enLight{from{transform:translateX(-30%)}to{transform:translateX(20%)}}
@keyframes enSceneCoffee{from{opacity:.45;transform:scale(1.03) translateY(-3%)}to{opacity:1;transform:scale(1.18) translateY(-9%)}}
@keyframes enSceneGaze{from{opacity:.55;transform:scale(1.08) translateX(2%)}to{opacity:1;transform:scale(1.2) translateX(-3%)}}
@keyframes enCamera{from{opacity:0;transform:scale(1.16) translateX(4%);filter:blur(5px) saturate(.4) brightness(.62)}to{opacity:.96;transform:scale(1.04);}}
@keyframes enSlide{from{opacity:0;transform:scale(1.08) translateX(8%)}to{opacity:.94;transform:scale(1.02) translateX(0)}}
@keyframes enGaze{from{opacity:.25;transform:scale(1.12) translateX(3%);filter:blur(3px) saturate(.4) brightness(.65)}to{opacity:1;transform:scale(1.025);}}

/* ZH: soft certainty and being remembered */
#opening[data-opening="zh"]{background:linear-gradient(155deg,#f8dce6,#c97899 58%,#6f3655);color:#fff8fb}
#opening[data-opening="zh"] .op-caption{text-align:center;text-shadow:0 3px 20px rgba(91,28,59,.25)}
#opening[data-opening="zh"] .op-scene-image{background-position:55% center;filter:saturate(.78) contrast(.98)}
#opening[data-opening="zh"] .op-message .op-scene-image{background-position:78% 82%;animation-name:zhSceneCoffee}
#opening[data-opening="zh"] .op-reach .op-scene-image{background-position:59% 50%;animation-name:zhSceneNear}
#opening[data-opening="zh"] .op-world::before,#opening[data-opening="zh"] .op-world::after{content:"";position:absolute;border-radius:50%;filter:blur(18px);background:rgba(255,255,255,.26);animation:zhFloat 3s ease-in-out infinite alternate}
#opening[data-opening="zh"] .op-world::before{width:220px;height:220px;left:-60px;top:8%}
#opening[data-opening="zh"] .op-world::after{width:160px;height:160px;right:-20px;bottom:12%;animation-delay:-1.2s}
#opening[data-opening="zh"] .op-character{width:92%;left:auto;right:-15%;background-size:cover;background-position:center 8%;filter:saturate(.72) sepia(.06) brightness(.92);
  -webkit-mask-image:linear-gradient(to left,#000 55%,rgba(0,0,0,.78) 72%,transparent 100%);mask-image:linear-gradient(to left,#000 55%,rgba(0,0,0,.78) 72%,transparent 100%);
  animation:zhPerson 2.15s cubic-bezier(.2,.75,.2,1) both}
#opening[data-opening="zh"] .op-frame:not(.op-brand)::after{content:"";position:absolute;inset:0;z-index:1;background:
  linear-gradient(90deg,rgba(112,38,73,.68),transparent 72%),linear-gradient(0deg,rgba(81,26,53,.52),transparent 46%)}
#opening[data-opening="zh"] .op-caption{z-index:3}
#opening[data-opening="zh"] .op-message .op-caption{width:64%;margin-right:auto;margin-left:7%;padding:26px 18px;border-radius:30px;background:rgba(255,249,252,.18);backdrop-filter:blur(13px)}
#opening[data-opening="zh"] .op-reach .op-character{width:100%;right:-24%;background-position:52% 7%;animation-name:zhNear}
#opening[data-opening="zh"] .op-reach .op-caption{align-self:flex-end;margin-bottom:17vh;text-align:left;width:82%}
@keyframes zhFloat{to{transform:translate(20px,-16px) scale(1.12)}}
@keyframes zhSceneCoffee{from{opacity:.45;transform:scale(1.02)}to{opacity:1;transform:scale(1.16) translate(-4%,-5%)}}
@keyframes zhSceneNear{from{opacity:.5;transform:scale(1.06) translateX(3%)}to{opacity:1;transform:scale(1.18) translateX(-2%)}}

function savedProgress(id){

 }catch(_){return{chapter:1,complete:false}}

async function loadChapterObjective(){
 try{
  const info=await (await fetch(API+"/story/"+encodeURIComponent(route.id))).json();
  if(!info.has_story||!info.chapters||!info.chapters.length)return;
  const cid=storyState.chapter||info.chapters[0].id;
  const index=Math.max(0,info.chapters.findIndex(c=>c.id===cid)),chapter=info.chapters[index]||info.chapters[0];
  renderChapter({...chapter,chapter_index:index+1,chapter_total:info.chapters.length});
 }catch(e){console.warn("[flutter/objective]",e);}
}
function chooseRoute(id,el){
 if(document.getElementById("select").classList.contains("leaving"))return;
 document.querySelectorAll(".card").forEach(card=>{
  card.style.opacity=card===el?"1":".18";
  if(card===el)card.style.transform="translateY(-8px) scale(1.055)";
 });
 document.getElementById("select").classList.add("leaving");
 setTimeout(()=>{
  startRoute(id);
  const select=document.getElementById("select");
  select.classList.remove("leaving","reveal");
  document.querySelectorAll(".card").forEach(card=>{card.style.opacity="";card.style.transform=""});
 },620);
}

function syncMusicMood(mood){
 if(!window.FLUTTER_AUDIO)return;
 const mark=String(mood||"");
 if(/[😔😢💔🌧🥀]/u.test(mark))FLUTTER_AUDIO.setScene("melancholy");
 else FLUTTER_AUDIO.setScene(aff>=30?"intimate":"conversation");
}
function directMusic(cue){
 if(!window.FLUTTER_AUDIO)return;
 cue=cue||{};
 const s=cue.signals||{},text=String(cue.text||"").toLowerCase();
 const sad=/(难过|失去|离开|告别|哭|眼泪|雨|hurt|leave|goodbye|cry|rain|triste|llorar|chuva|さよなら|涙|雨)/i.test(text);
 if(cue.kind==="choice"||cue.kind==="goal"||s.boundary_violation){
  if(cue.kind==="goal"||s.boundary_violation)FLUTTER_AUDIO.playCue("longing");
  FLUTTER_AUDIO.setScene("tension");return;
 }
 if(cue.kind==="clear"){
  FLUTTER_AUDIO.playCue("tender");
  FLUTTER_AUDIO.setScene("resolution");return;
 }
 if(sad||/[😔😢💔🌧🥀]/u.test(String(cue.mood||""))){
  FLUTTER_AUDIO.playCue("longing");
  FLUTTER_AUDIO.setScene("melancholy");return;
 }
 if(cue.kind==="intimate"||s.flirt>0||s.depth>0||s.care>0||aff>=30){
  if(s.flirt>0)FLUTTER_AUDIO.playCue("spark");
  else if(s.depth>0||s.care>0||cue.kind==="intimate")FLUTTER_AUDIO.playCue("tender");
  FLUTTER_AUDIO.setScene("intimate");return;
 }
 FLUTTER_AUDIO.setScene("conversation");
}

function claimAct(key,base){
 const chapter=storyState.chapter||"ch1",used=storyState.actions_used||{};
 const keys=used[chapter]||[];
 if(keys.includes(key))return 0;
 used[chapter]=[...keys,key];storyState.actions_used=used;
 return base;
}
function doAct(k){
 if(busy) return;
 const a=ACT_LIB[k]; if(!a) return;
 const zh=lang==="zh";
 const meTxt=a.me[zh?"zh":"en"];
 const rid=route.id;
 const rp=(a.reply[rid]&&a.reply[rid][zh?"zh":"en"])
          || (zh?"（他望向你，眼底有笑意）":"(he looks at you, warmth in his eyes)");
 // 走一遍 say() 的收尾流程但不打 LLM
 pushBubble(meTxt,'me');
 hist.push({role:"user",content:meTxt});
 hist.push({role:"assistant",content:rp});
 const prev=aff;
 const gain=claimAct(k,a.heart);
 aff=Math.min(aff+gain,100);
 updateAff(true);
 typeLine(rp);
 directMusic({kind:(k==="lean"||k==="gift")?"intimate":"conversation",text:rp});
 if(gain)heartGain(gain);
 if(tierOf(aff)>tierOf(prev)) maybeFbBar();
 // 里程碑触发 (与 say() 一致)
 const ms={10:["初识","First spark"],30:["心动","Heartbeat"],60:["交心","Trust"],100:["怦然","Fallen for you"]};
 if(ms[aff]) celebrate(zh?ms[aff][0]:ms[aff][1]);
 save();
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
// 轻量markdown->HTML: 转义后还原行内标记(**粗**/*斜*/_斜_/`码`),换行->br
function mdInline(s){
 let h=esc(s);
 h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 h=h.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
 h=h.replace(/(^|[^_\w])_([^_\n]+)_/g,'$1<em>$2</em>');
 h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
 h=h.replace(/\n/g,'<br>');
 return h;
}

// ── 聊天流: 每句话累积成气泡, 可上滑回看之前的对话 ──
function pushBubble(text, who){ // who: 'me' | 'them' | 'ev'
 const log=document.getElementById("chatlog");
 const b=document.createElement("div");
 b.className="msg "+who;
 b.innerHTML=(who==='me')?esc(text):mdInline(text);
 log.appendChild(b);
 log.scrollTop=log.scrollHeight;
 return b;
}

// ── 等待期情境化动画(零服务器成本): "对方正在输入"的呼吸点 ──
let waitTimer=null;
function startWaitAnim(){
  const el=document.getElementById("line");
  const hintSets={
   zh:["正在想怎么回你…","在打字…","停顿了一下…","似乎在斟酌用词…"],
   en:["thinking of what to say…","typing…","pauses for a moment…","choosing words carefully…"],
   ja:["ことばを選んでいる…","入力中…","少し、間があいた…","考えている…"],
   es:["está pensando qué decir…","escribiendo…","hace una pausa…","elige bien las palabras…"],
   "pt-BR":["pensando no que dizer…","digitando…","faz uma pausa…","escolhendo as palavras…"]
  };
  const hints=hintSets[lang]||hintSets.en;
  let dots=0, hi=Math.floor(Math.random()*hints.length);
  clearInterval(typing);
  waitTimer=setInterval(()=>{
    dots=(dots+1)%4;
    el.innerHTML=`<span style="opacity:.55;font-style:italic">${hints[hi]}${".".repeat(dots)}</span>`;
    if(dots===0&&Math.random()<0.3)hi=(hi+1)%hints.length;
  },520);
}
function stopWaitAnim(){if(waitTimer){clearInterval(waitTimer);waitTimer=null;}}

function typeLine(txt,commit){ // commit!==false时: 打完把这句移入聊天流气泡
 clearInterval(typing);const el=document.getElementById("line");el.innerHTML="";
 let i=0;const cur='<span class="cursor">&nbsp;</span>';el.innerHTML=cur;
 const log=document.getElementById("chatlog");
 typing=setInterval(()=>{i++;
   if(i>=txt.length){
     el.innerHTML=mdInline(txt);clearInterval(typing);
     if(window.FLUTTER_AUDIO)FLUTTER_AUDIO.speak(txt,edition.locale);
     if(commit!==false){ // 打字完成→提交进聊天流, dbox行清空
       pushBubble(txt,'them');
       el.innerHTML="";
     }
   }
   else{el.innerHTML=esc(txt.slice(0,i))+cur;
     if(log)log.scrollTop=log.scrollHeight;}
 },26);
}

// 段位: 名字/emoji/区间。好感在段位内的进度=进度条(鼓励冲下一段)
const TIERS=[
 {min:0,zh:"初识",en:"First Spark",ja:"はじまり",es:"Primera chispa",pt:"Primeiro olhar",e:"◇"},
 {min:10,zh:"心动",en:"Heartbeat",ja:"ときめき",es:"Latido",pt:"Sintonia",e:"♡"},
 {min:30,zh:"交心",en:"Trust",ja:"信頼",es:"Confianza",pt:"Confiança",e:"◈"},
 {min:60,zh:"情浓",en:"Falling",ja:"近づく",es:"Cayendo",pt:"Mais perto",e:"◆"},
 {min:100,zh:"怦然",en:"Fallen",ja:"あわい",es:"Sin distancia",pt:"Entre nós",e:"♥"}
];
function tierLabel(t){
 const key=lang==="pt-BR"?"pt":lang;
 return t[key]||t.en;
}
function tierInfo(a){let i=0;for(let k=0;k<TIERS.length;k++)if(a>=TIERS[k].min)i=k;
 const cur=TIERS[i],nxt=TIERS[i+1];
 const lo=cur.min,hi=nxt?nxt.min:100;
 const pct=hi>lo?Math.min(100,(a-lo)/(hi-lo)*100):100;
 return{cur,nxt,lo,hi,pct,idx:i};}
let _lastTierIdx=0;
function updateAff(anim){ if(route) updatePortrait();
 const t=tierInfo(aff);
 // 进度条=当前段位内进度(离下一段多远),不是绝对0-100→更有奔头
 document.getElementById("fill").style.width=t.pct+"%";
 const badge=document.getElementById("tierbadge");
 badge.textContent=t.cur.e+" "+tierLabel(t.cur);
 const complete={zh:"圆满",en:"Complete",ja:"満ちる",es:"Completo","pt-BR":"Completo"}[lang]||"Complete";
 document.getElementById("affpct").textContent=t.nxt?(aff+" → "+t.hi):(complete+" "+aff);
 // 跨段位: 徽章脉冲 + 进度条发光
 if(t.idx>_lastTierIdx && _lastTierIdx>=0 && anim){
   badge.classList.remove("tierpulse");void badge.offsetWidth;badge.classList.add("tierpulse");
   const g=document.getElementById("barglow");g.style.width="100%";g.style.opacity="1";
   setTimeout(()=>{g.style.opacity="0";},900);
 }
 _lastTierIdx=t.idx;
 document.getElementById("fill").parentNode.querySelector("#barglow").style.width=t.pct+"%";
}
// +N ♥ 飘字: 说得好飘大金心,敷衍飘小灰字。用 CSS @keyframes 播,不依赖 transition 触发时机
function heartGain(n){
 const st=document.querySelector(".stage");
 const r=st?st.getBoundingClientRect():{left:window.innerWidth/2-40,top:window.innerHeight*0.35,width:80,height:120};
 const el=document.createElement("div");el.className="heartgain";
 const gainMark={zh:"♥",en:"◆",ja:"・",es:"◆","pt-BR":"☀"}[lang]||"◆";
 el.textContent="+"+n+" "+gainMark;
 const sz=n<=1?2.0:n===2?2.4:n===3?2.8:n===4?3.2:3.6;
 const col=edition.palette.glowA;
 // 起点: 屏幕底部输入框上方; 终点: 屏幕顶部, 停留展示直到点击关闭 or 8秒自动消失
 const x=Math.max(30,Math.min(window.innerWidth-120, window.innerWidth/2-40+(Math.random()*80-40)));
 const y=window.innerHeight-160;
 el.style.cssText+=`left:${x}px;top:${y}px;font-size:${sz}em;color:${col}`;
 el.onclick=()=>el.remove();
 document.body.appendChild(el);
 setTimeout(()=>{if(el.parentNode)el.remove();},8000);
}

async function say(){
 if(busy)return;const inp=document.getElementById("inp"),msg=inp.value.trim();if(!msg)return;
 inp.value="";busy=true;document.getElementById("send").disabled=true;
 hist.push({role:"user",content:msg});
 pushBubble(msg,'me');
 try{
  startWaitAnim();
  const r=await (await fetch(API+"/say",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({route:route.id,history:hist.slice(0,-1),memory:mem,message:msg,affection:aff,lang:lang,pid:pid(),story_state:storyState})})).json();
  stopWaitAnim();
  hist.push({role:"assistant",content:r.reply});
  if(r.memory_update)mem=(mem?mem+" ":"")+r.memory_update;
  const prev=aff;aff=r.affection;
  document.getElementById("mood").textContent=r.mood||"💗";
  directMusic({mood:r.mood,signals:r.signals,text:(r.beat||"")+" "+(r.reply||"")});
  updateAff(true);typeLine(r.reply);
  if(typeof r.heart_gain==="number"&&r.heart_gain>0)heartGain(r.heart_gain);
  else if(aff>prev)floatHeart();
  if(tierOf(aff)>tierOf(prev))maybeFbBar();
  if(r.milestone)celebrate(r.milestone);
  // 故事线: 更新章节/依恋/触发事件/章末抉择
  if(r.story_state)storyState=r.story_state;
  if(r.story)renderChapter(r.story);
  if(r.goal_hint)setTimeout(()=>showGoalHint(r.goal_hint),(r.reply?r.reply.length*26:0)+400);

    if(!queue.length||!TAPI) return;
    const batch = queue.splice(0,50);
    const body = JSON.stringify(batch);
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(TAPI+"/tel_batch", new Blob([body],{type:"application/json"}));
    } else {
      fetch(TAPI+"/tel_batch",{method:"POST",headers:{"Content-Type":"application/json"},body}).catch(()=>{});
    }
  }
  // 自动: pageview
  push("pageview", location.pathname||"/", document.title||"");
  // 自动: 所有click(记录元素id/class/文本)
  document.addEventListener("click", e=>{
    const el=e.target.closest("button,a,[data-tel],.card,.chip,[role=button]");
    if(!el)return;
    push("click", el.id||el.dataset.tel||el.className||el.tagName,
         (el.innerText||"").trim().slice(0,60));
  }, true);
  // 自动: 会话时长(离开时上报)
  window.addEventListener("beforeunload", ()=>{
    push("session_end","session","",Math.round((Date.now()-t0)/1000));
    flush(true);
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(true); });
  setInterval(()=>flush(), 20000);   // 定期flush
  // 暴露手动埋点: TEL.chat(用户消息,回复) / TEL.feedback(分数,留言) / TEL.ev(类型,名,值)
  window.TEL = {
    chat: (userMsg, reply, meta)=>push("chat","message",{u:String(userMsg).slice(0,800),r:String(reply).slice(0,1200),...(meta||{})}),
    feedback: (score, note)=>push("feedback","rating",{score,note:String(note||"").slice(0,500)}),
    ev: (name, value)=>push("custom",name,value),
    flush
  };
})();
</script>

</body></html>
