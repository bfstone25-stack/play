<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>怦然 FLUTTER — 静态版</title>
<meta name="description" content="怦然 Flutter：不依赖任何服务器/大模型的纯静态剧情版。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0c0a10; --panel:#17131d; --panel2:#1f1a28; --ink:#f2e9f5; --muted:#b9a9c4;
    --accent:#e8b06a; --glow:0 0 40px rgba(232,176,106,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    position:relative;overflow:hidden;}
  #portraitWrap{position:relative;width:100%;aspect-ratio:3/4;background:#000;overflow:hidden;
    flex-shrink:0;}
  #portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:opacity .5s ease;opacity:0}
  #portrait.show{opacity:1}
  #portraitWrap::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(12,10,16,0) 45%,rgba(12,10,16,.94) 100%);}
  #routeBadge{position:absolute;top:14px;left:14px;z-index:2;background:rgba(12,10,16,.55);
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;
    padding:6px 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;}
  #chapterTag{position:absolute;top:14px;right:14px;z-index:2;font-size:12px;color:var(--muted);
    background:rgba(12,10,16,.55);border-radius:999px;padding:6px 12px;}
  #panel{flex:1;display:flex;flex-direction:column;padding:0 20px 26px;margin-top:-64px;
    position:relative;z-index:1;}
  #chapterTitle{font-size:13px;letter-spacing:.06em;color:var(--accent);margin:0 0 6px;
    text-transform:uppercase;}
  #text{font-size:17px;line-height:1.75;white-space:pre-wrap;min-height:96px;margin:0 0 18px;}
  #choices{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .opt{background:var(--panel2);border:1px solid rgba(255,255,255,.08);color:var(--ink);
    text-align:left;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.5;
    cursor:pointer;transition:border-color .2s,transform .1s;}
  .opt:hover{border-color:var(--accent)}
  .opt:active{transform:scale(.98)}
  #continueBtn{align-self:flex-end;background:var(--accent);color:#241708;border:none;
    padding:12px 26px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:var(--glow);}
  #continueBtn:active{transform:scale(.97)}
  #meta{font-size:12px;color:var(--muted);margin-top:auto;padding-top:18px;text-align:center;}
  #menu{padding:40px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;}
  #menu h1{font-size:22px;margin:0 0 2px;}
  #menu p.sub{color:var(--muted);margin:0 0 20px;font-size:14px;}
  .route{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);}
  .route img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .route .name{font-size:16px;font-weight:600;margin:0 0 2px;}
  .route .tag{font-size:12px;color:var(--muted);}
  #ending{padding:34px 24px;display:flex;flex-direction:column;min-height:100%;}
  #ending h2{color:var(--accent);font-size:20px;margin:0 0 14px;}
  #ending p{line-height:1.9;font-size:15.5px;white-space:pre-wrap;}
  #restart{margin-top:24px;background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:12px;border-radius:999px;font-size:14px;cursor:pointer;}
  .hidden{display:none !important;}
  #langToggle{background:none;border:1px solid rgba(255,255,255,.2);color:var(--muted);
    border-radius:999px;font-size:12px;padding:4px 10px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">

  <div id="menu">
    <h1>怦然 FLUTTER</h1>
    <p class="sub">静态版 · 无需服务器 / 无需联网大模型 · 剧情完全离线可玩</p>
    <div id="routeList"></div>
  </div>

  <template id="playTpl">
    <div id="portraitWrap">
      <div id="routeBadge"><span id="routeName"></span> <button id="langToggle">EN</button></div>
      <div id="chapterTag"></div>
      <img id="portrait" alt="">
    </div>
    <div id="panel">
      <p id="chapterTitle"></p>
      <div id="text"></div>
      <div id="choices"></div>
      <button id="continueBtn">继续 →</button>
      <div id="meta"></div>
    </div>
  </template>

</div>
<script type="module">
import { StoryPlayer, rescaleAff, affRange } from "./story_engine.js";

const app = document.getElementById("app");
const menu = document.getElementById("menu");
const routeList = document.getElementById("routeList");

let zh = true; // display language; content falls back to EN if a zh field is missing
let chars, player, routeMeta;

async function boot() {
  chars = await (await fetch("chars.json")).json();
  for (const r of chars.routes) {
    const btn = document.createElement("button");
    btn.className = "route";
    const master = `portraits/v2/masters/${r.id}-master-v1.webp`;
    btn.innerHTML = `<img src="${master}" alt=""><span>
        <p class="name">${r.name_zh || r.name_en}</p>
        <p class="tag">${r.title_zh || r.title_en} · ${r.tag_zh || r.tag_en || ""}</p>
      </span>`;
    btn.onclick = () => startRoute(r);
    routeList.appendChild(btn);
  }
}

async function startRoute(route) {
  routeMeta = route;
  const story = await (await fetch(`stories/${route.id}.json`)).json();
  player = new StoryPlayer(story);
  mountPlayUI();
  render(player.current());
}

let ui;
function mountPlayUI() {
  menu.classList.add("hidden");
  const tpl = document.getElementById("playTpl").content.cloneNode(true);
  app.appendChild(tpl);
  ui = {
    portrait: document.getElementById("portrait"),
    routeName: document.getElementById("routeName"),
    chapterTag: document.getElementById("chapterTag"),
    chapterTitle: document.getElementById("chapterTitle"),
    text: document.getElementById("text"),
    choices: document.getElementById("choices"),
    continueBtn: document.getElementById("continueBtn"),
    meta: document.getElementById("meta"),
    langToggle: document.getElementById("langToggle"),
  };
  ui.routeName.textContent = routeMeta.name_zh || routeMeta.name_en;
  ui.langToggle.onclick = () => { zh = !zh; ui.langToggle.textContent = zh ? "EN" : "中"; render(player.current()); };
  ui.continueBtn.onclick = () => render(player.next());
}

function L(obj, base) {
  if (!obj) return "";
  return (zh ? obj[base + "_zh"] : obj[base + "_en"]) || obj[base + "_en"] || obj[base + "_zh"] || "";
}

function setPortrait(expr) {
  const src = expr === "master"
    ? `portraits/v2/masters/${routeMeta.id}-master-v1.webp`
    : `portraits/v2/variants/${routeMeta.id}-${expr}-v1.webp`;
  ui.portrait.classList.remove("show");
  const img = new Image();
  img.onload = () => { ui.portrait.src = src; ui.portrait.classList.add("show"); };
  img.onerror = () => { ui.portrait.src = `portraits/v2/masters/${routeMeta.id}-master-v1.webp`; ui.portrait.classList.add("show"); };
  img.src = src;
}

function render(s) {
  const chs = player.story.chapters;
  ui.chapterTag.textContent = `${player.chapterIndex + 1} / ${chs.length}`;
  ui.choices.innerHTML = "";
  ui.continueBtn.classList.remove("hidden");
  ui.meta.textContent = "";

  if (s.stage === "opening") {
    setPortrait("master");
    ui.chapterTitle.textContent = L(s.chapter, "title");
    ui.text.textContent = L(s.chapter, "opening");
    return;
  }
  if (s.stage === "beat") {
    setPortrait("smile");
    ui.chapterTitle.textContent = L(s.chapter, "title");
    ui.text.textContent = zh ? (s.beat.event_zh || s.beat.event_en) : (s.beat.event_en || s.beat.event_zh);
    return;
  }
  if (s.stage === "choice") {
    setPortrait("blush");
    ui.chapterTitle.textContent = L(s.chapter, "title");
    ui.text.textContent = L(s.choice, "prompt");
    ui.continueBtn.classList.add("hidden");
    s.choice.options.forEach((opt, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = zh ? (opt.text_zh || opt.text_en) : (opt.text_en || opt.text_zh);
      b.onclick = () => render(player.choose(i));
      ui.choices.appendChild(b);
    });
    return;
  }
  if (s.stage === "reply") {
    setPortrait("love");
    ui.chapterTitle.textContent = L(s.chapter, "title");
    const r = s.reply;
    ui.text.textContent = zh ? (r.reply_zh || r.reply_en) : (r.reply_en || r.reply_zh);
    ui.continueBtn.textContent = player.isLastChapter ? "查看结局 →" : "下一章 →";
    return;
  }
  if (s.stage === "ending") {
    renderEnding(s);
  }
}

function renderEnding(s) {
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.id = "ending";
  const e = s.ending;
  wrap.innerHTML = `
    <h2>${zh ? (e.title_zh || e.title_en) : (e.title_en || e.title_zh)}</h2>
    <p>${(zh ? (e.text_zh || e.text_en) : (e.text_en || e.text_zh))}</p>
    <button id="restart">重新开始 · Restart</button>
  `;
  app.appendChild(wrap);
  document.getElementById("restart").onclick = () => location.reload();
}

boot();
</script>
</body>
</html>
