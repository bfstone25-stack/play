[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; wqy-microhei.ttc is INCLUDED here, unlike Floor 13's preset which excludes *.ttc.
; Floor 13 draws its Chinese from a pixel .fnt; Flutter has five editions (en, zh, ja, es,
; pt-BR) and the CJK face is the fallback the menu and the subtitle resolve through. Left
; out, the zh and ja builds render boxes on the web export and nowhere else — the
; `godot-web-font-fallback` defect, which is invisible on the desktop run.
include_filter="assets/fonts/*.ttf,assets/fonts/*.ttc,assets/fonts/*.txt,assets/title/*,assets/sfx/*.wav"
exclude_filter="build/*,tests/*,tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body,#canvas{background:#1c0a16}#status{visibility:visible!important;background:#1c0a16 url('index.png') center/cover no-repeat!important}#status-splash{opacity:1;object-fit:cover!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.11, 0.04, 0.086, 1)

