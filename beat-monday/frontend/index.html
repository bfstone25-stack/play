:root{--red:#e23b2f;--cobalt:#1e4cff;--yellow:#f5d031;--black:#0a0b10;--ink:#f4f0e6;--dim:#8b8d99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--black);color:var(--ink);font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif}
#app{position:fixed;inset:0;max-width:1100px;margin:0 auto;background:#0a0b10}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.bars{position:absolute;top:10px;left:10px;right:10px;display:grid;grid-template-columns:1fr 64px 1fr;gap:8px;align-items:start}
.hpWrap{height:18px;background:#1a1320;border:2px solid #f5d031;overflow:hidden}
.hpWrap.p2{display:flex;justify-content:flex-end}
#p1Hp,#p2Hp{height:100%;width:100%;background:linear-gradient(90deg,#e23b2f,#f5d031)}
#p2Hp{margin-left:auto}
.name{font:800 11px ui-monospace,monospace;letter-spacing:1px;color:#fff;margin-bottom:4px}
.p2n{text-align:right}
#hudTimer{font:900 28px/1 "Arial Black",Impact,sans-serif;color:var(--yellow);text-align:center;text-shadow:0 0 12px rgba(245,208,49,.4)}
#hudRounds{grid-column:1/-1;text-align:center;color:var(--yellow);font:800 12px ui-monospace,monospace;letter-spacing:3px}
.meters{position:absolute;top:62px;left:10px;right:10px;display:flex;justify-content:space-between}
.meter{width:28%;height:6px;background:#161822;border:1px solid #2c3348}
#p1Meter,#p2Meter{height:100%;width:0;background:var(--cobalt);box-shadow:0 0 8px rgba(30,76,255,.5)}
#btnPause{pointer-events:auto;position:absolute;top:10px;right:10px;min-width:44px;height:36px;z-index:5;border:1px solid #3a3148;background:rgba(10,11,16,.7);color:var(--ink);font:700 10px ui-monospace,monospace}
#hudAnnounce{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font:900 42px/1 "Arial Black",Impact,sans-serif;letter-spacing:3px;color:var(--yellow);text-shadow:4px 4px 0 #e23b2f;opacity:0;pointer-events:none}
#hudAnnounce.show{opacity:1}
#pad{pointer-events:auto;position:absolute;left:10px;bottom:14px;width:148px;height:148px}
.dbtn{position:absolute;width:46px;height:46px;border:1px solid rgba(245,208,49,.5);background:rgba(30,76,255,.18);color:var(--yellow);font:800 16px sans-serif;display:flex;align-items:center;justify-content:center}
.dbtn:active{background:rgba(245,208,49,.35)}
#padU{left:51px;top:0}#padD{left:51px;bottom:0}#padL{left:0;top:51px}#padR{right:0;top:51px}
#btns{pointer-events:auto;position:absolute;right:10px;bottom:18px;display:flex;gap:8px}
#btns button{width:72px;height:72px;border-radius:50%;border:2px solid var(--yellow);background:rgba(226,59,47,.85);color:#fff;font:800 11px ui-monospace,monospace;letter-spacing:1px}
#btnK{background:rgba(30,76,255,.85);border-color:#9ab}
#btnS{background:#14110a;color:var(--yellow)}
#btnS:active,#btnP:active,#btnK:active{transform:scale(.94)}
.storyCard{width:min(520px,100%);background:#10131c;border:1px solid #2c3348;border-top:3px solid var(--yellow);padding:18px;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
#storyArt{width:120px;height:160px;object-fit:cover;object-position:top;background:#161822;border:1px solid #2c3348}
.storyCopy{min-width:0}
#storyKicker{font:800 10px ui-monospace,monospace;letter-spacing:2px;color:var(--red);margin-bottom:6px}
#storyTitle{margin:0 0 8px;font:800 20px/1.15 "Arial Black",Impact,sans-serif;color:var(--yellow)}
#storyBody{margin:0 0 12px;color:#d4d0c6;font:500 14px/1.5 -apple-system,sans-serif}
#storyGo{grid-column:1/-1}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.ov.show{display:flex}
#homeOv{z-index:40;background:#0a0b10;overflow:hidden}
#homeOv:before{content:"";position:absolute;inset:-4%;background:url("assets/title.webp") center/cover no-repeat;filter:saturate(1.1) contrast(1.08);animation:ken 18s ease-in-out infinite alternate}
#homeOv:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(10,11,16,.15),rgba(10,11,16,.82) 72%),linear-gradient(180deg,rgba(10,11,16,.2),rgba(10,11,16,.92));pointer-events:none}
@keyframes ken{from{transform:scale(1.04)}to{transform:scale(1.12) translateY(-2%)}}
@media(prefers-reduced-motion:reduce){#homeOv:before{animation:none}#hudWarn.show{animation:none;opacity:1}}

.word{position:absolute;left:18px;top:16%;}
#wordLocal{margin:0;font:900 clamp(42px,13vw,68px)/.85 "Arial Black",Impact,sans-serif;letter-spacing:-1px;color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 rgba(30,76,255,.55)}
#wordEn{display:block;margin-top:10px;font:800 11px ui-monospace,monospace;letter-spacing:4px;color:var(--yellow)}
#homeTag{position:absolute;left:18px;top:42%;max-width:80%;font:800 12px/1.4 ui-monospace,monospace;letter-spacing:1.4px;color:var(--yellow)}
#homeQuote{position:absolute;left:18px;right:18px;top:50%;color:#c9c6bc;font:500 14px/1.5 -apple-system,sans-serif}
.homeActs{position:absolute;left:18px;bottom:78px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.homeActs button{border:0;background:transparent;color:#fff;padding:10px 8px 10px 22px;min-height:44px;font:800 18px "Arial Black",Impact,sans-serif;letter-spacing:1px;cursor:pointer;position:relative;text-align:left}
.homeActs button:before{content:"";position:absolute;left:0;top:50%;width:14px;height:3px;background:var(--yellow)}
#btnDaily{color:var(--yellow)}
#btnHow,#btnSettings,#btnDebrief{font:700 12px ui-monospace,monospace;letter-spacing:2px;color:#b7b5ae}
#homeFoot{position:absolute;left:18px;bottom:22px;color:#6d6f7a;font:500 10px/1.4 -apple-system,sans-serif}
.panel{width:min(420px,100%);background:#10131c;border:1px solid #2c3348;border-top:3px solid var(--yellow);padding:22px 18px;box-shadow:0 20px 60px #000}
.panel h2{margin:0 0 12px;font:800 22px "Arial Black",Impact,sans-serif;letter-spacing:1px;color:var(--yellow)}
.panel p,.panel .rules{color:#d4d0c6;font-size:14px;line-height:1.55}
.panel .rules div{margin:8px 0}
.go,.ghost{width:100%;min-height:46px;margin-top:14px;border:0;font:800 14px ui-monospace,monospace;letter-spacing:1.5px;cursor:pointer}
.go{background:var(--yellow);color:#14110a}
.ghost{background:transparent;border:1px solid #3a3148;color:#d4d0c6}
.setRow{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:8px 0;border:0;border-bottom:1px solid #262a38;background:transparent;color:#d4d0c6;font:600 14px -apple-system,sans-serif;cursor:pointer}
.setRow b{color:var(--yellow);font:800 12px ui-monospace,monospace}
#levelOv{background:rgba(8,8,12,.72);backdrop-filter:blur(6px)}
#levelCards{display:flex;flex-direction:column;gap:10px}
.card{min-height:84px;padding:14px 14px 12px;border:1px solid #334;background:linear-gradient(180deg,#171b28,#10131c);color:#fff;text-align:left;cursor:pointer}
.card em{display:block;font:800 18px "Arial Black",Impact,sans-serif;color:var(--yellow);font-style:normal}
.card span{display:block;margin-top:4px;color:#c9c6bc;font-size:13px}
.card small{color:var(--red);font:700 10px ui-monospace,monospace;letter-spacing:1px}
#resTitle{margin:0 0 16px;font:800 26px/1.1 "Arial Black",Impact,sans-serif;letter-spacing:.5px}
#resTitle[data-v=heroic]{color:var(--yellow)}
#resTitle[data-v=grim]{color:#d8d0b0}
#resTitle[data-v=death]{color:var(--red)}
#resStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
#resStats div{background:#161822;padding:10px 6px;text-align:center}
#resStats i{display:block;font:700 9px ui-monospace,monospace;color:var(--dim);letter-spacing:1px}
#resStats b{display:block;margin-top:4px;font:800 18px ui-monospace,monospace}
#fbEmos{display:flex;justify-content:center;gap:10px;margin:12px 0}
.emo{width:52px;height:52px;font-size:24px;border:1px solid #334;background:#161822;cursor:pointer}
.emo.on{border-color:var(--yellow);transform:translateY(-2px)}
#fbNote{width:100%;min-height:70px;margin:8px 0;padding:10px;background:#0c0e14;border:1px solid #2c3348;color:#f4f0e6;font:14px -apple-system,sans-serif}
</style>

(function(){

  window.__TEL_BOOTED__ = true;

    if (!APP) {
      var m = (location.pathname || "").match(/^\/([^\/]+)/);
      if (m && m[1] && m[1] !== "tel_batch" && m[1] !== "tel") APP = m[1];
    }
  } catch (e) {}
  if (API && APP && !/\/[a-z0-9_-]+$/i.test(API.replace(/\/+$/,"")) && API.indexOf(APP) < 0) {
    API = API.replace(/\/+$/, "") + "/" + APP;
  }
  window.TEL_API = API;
  window.TEL_APP = APP;
  var pid = (function(){
    var p = localStorage.getItem("tel_pid");
    if (!p) { p = "u" + Math.random().toString(36).slice(2, 10); localStorage.setItem("tel_pid", p); }
    return p;
  })();
  var sid = "s" + Math.random().toString(36).slice(2, 10);
  var t0 = Date.now();
  var queue = [];
  function push(etype, name, value, dur){
    queue.push({
      app: APP || undefined,
      pid: pid,
      sid: sid,
      etype: etype,
      name: String(name || "").slice(0, 120),
      value: typeof value === "string" ? value : JSON.stringify(value || ""),
      dur: dur || 0
    });
    if (queue.length >= 8) flush();
  }
  function flush(useBeacon){
    if (!queue.length || !API) return;
    var batch = queue.splice(0, 50);
    var body = JSON.stringify(batch);
    var url = API.replace(/\/+$/, "") + "/tel_batch";
    try {
      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], {type: "application/json"}));
      } else {
        fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: body, mode: "cors", keepalive: true}).catch(function(){});

  }
  push("pageview", location.pathname || "/", document.title || "");
  document.addEventListener("click", function(e){
    var el = e.target && e.target.closest && e.target.closest("button,a,[data-tel],.card,.chip,[role=button],canvas");
    if (!el) return;
    if (!lastCustom) { lastCustomAt = Date.now(); }

    if (pwSeenAt && !pwDecided) push("paywall_decision", "leave", "", Math.round((Date.now() - pwSeenAt) / 1000));

    flush(true);

  document.addEventListener("visibilitychange", function(){ if (document.hidden) flush(true); });
  setInterval(function(){ flush(); }, 20000);

  // ---- psychology layer -------------------------------------------------
  // Counting heads told us "75 plays, 0 buys" and nothing about why. These events
  // are chosen to answer why: where people came from, how long they hesitated at
  // the door, whether they were actually paying attention, where they got
  // frustrated, what they did when they saw a price, and whether they came back.
  var store = {};
  try { store = JSON.parse(localStorage.getItem("tel_me") || "{}") || {}; } catch (e) {}
  var nowS = Math.round(Date.now() / 1000);
  var visits = (store.visits || 0) + 1;
  var firstSeen = store.first || nowS;
  var daysSince = store.last ? Math.round((nowS - store.last) / 86400) : 0;
  var src = "";
  try { src = new URLSearchParams(location.search).get("src") || ""; } catch (e) {}
  var refHost = "";
  try { refHost = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
  if (!store.src && (src || refHost)) store.src = src || refHost;   // first touch wins

  try { localStorage.setItem("tel_me", JSON.stringify(store)); } catch (e) {}
  // arrive: referral_source + return behaviour + device, once per session
  push("arrive", src || refHost || "direct", {
    src: src, ref: refHost, first_src: store.src || "", visit: visits,
    days_since_last: daysSince, returning: visits > 1,
    w: window.innerWidth, h: window.innerHeight, touch: "ontouchstart" in window,
    lang: navigator.language || "", embedded: window.top !== window.self
  });
  // engaged: seconds of hesitation before the first real interaction
  var engaged = false;
  function onFirst(){ if (engaged) return; engaged = true; push("engaged", "first_input", "", Math.round((Date.now() - t0) / 1000)); }
  ["pointerdown", "keydown", "touchstart"].forEach(function(n){ window.addEventListener(n, onFirst, {once: true, capture: true}); });

  var lastInput = Date.now(), active = 0, hiddenAt = 0, hiddenTotal = 0, awayCount = 0;
  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart", "scroll"].forEach(function(n){
    window.addEventListener(n, function(){ lastInput = Date.now(); }, {passive: true, capture: true});
  });

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) { hiddenAt = Date.now(); awayCount++; }
    else if (hiddenAt) { var away = Math.round((Date.now() - hiddenAt) / 1000); hiddenTotal += away; hiddenAt = 0;
      push("focus_back", lastCustom || "", {away_s: away}); }
  });
  // rage: 4+ clicks on the same thing inside 1.2s = frustration or a dead control
  var rc = 0, rt = 0, rk = "";
  document.addEventListener("pointerdown", function(e){
    var k = (e.target && (e.target.id || e.target.className || e.target.tagName)) + "";
    var now = Date.now();
    if (k === rk && now - rt < 1200) { rc++; if (rc === 4) push("rage", k.slice(0, 80), {last: lastCustom || ""}); }
    else { rk = k; rc = 1; }
    rt = now;
  }, true);
  // scroll depth: how far down a store/landing page they actually read
  var maxScroll = 0;
  window.addEventListener("scroll", function(){
    var d = document.documentElement, h = Math.max(1, d.scrollHeight - d.clientHeight);
    maxScroll = Math.max(maxScroll, Math.round(100 * (window.scrollY || d.scrollTop) / h));
  }, {passive: true});
  // last custom event = "where they stopped"; attached to session_end so exit point needs no join
  var lastCustom = "", lastCustomAt = Date.now();
  // paywall: seen (auto, when [data-tel-paywall] scrolls into view), then the decision and how long it took
  var pwSeenAt = 0, pwDecided = false;
  function paywallSeen(where){ if (pwSeenAt) return; pwSeenAt = Date.now(); push("paywall_seen", where || "", {last: lastCustom || ""}); }
  function paywallDecision(what, meta){
    if (!pwSeenAt || pwDecided) return; pwDecided = true;
    push("paywall_decision", what, meta || "", Math.round((Date.now() - pwSeenAt) / 1000));
  }
  try {
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function(es){ es.forEach(function(x){ if (x.isIntersecting) paywallSeen(x.target.getAttribute("data-tel-paywall") || "page"); }); }, {threshold: 0.5});
      var scan = function(){ document.querySelectorAll("[data-tel-paywall]").forEach(function(el){ io.observe(el); }); };
      scan(); new MutationObserver(scan).observe(document.documentElement, {childList: true, subtree: true});
    }
  } catch (e) {}
  document.addEventListener("click", function(e){
    var el = e.target && e.target.closest && e.target.closest("[data-tel-buy],[data-tel-promo],[data-tel-dismiss]");

    if (el.hasAttribute("data-tel-buy")) { paywallSeen("buy_button"); paywallDecision("buy_click", {price: el.getAttribute("data-tel-buy") || ""}); flush(true); }
    else if (el.hasAttribute("data-tel-dismiss")) paywallDecision("dismiss", "");
    else push("cross_promo_click", el.getAttribute("data-tel-promo") || el.href || "", {from: lastCustom || ""});
  }, true);
  // ads: only meaningful once a network is wired in; adblock is detected by the provider script never defining its global
  window.addEventListener("load", function(){
    setTimeout(function(){
      var slot = document.querySelector("[data-tel-ad]");
      if (!slot) return;
      var filled = slot.querySelector("iframe,img,ins") || slot.offsetHeight > 20;
      push(filled ? "ad_shown" : "ad_blocked", slot.getAttribute("data-tel-ad") || "slot", "");
    }, 4000);
  });
  var _sessionEndBase = null;
  window.__TEL_SESSION_SUMMARY__ = function(){
    return {active_s: active, away_s: hiddenTotal, away_n: awayCount, scroll: maxScroll,
            last: lastCustom, since_last_s: Math.round((Date.now() - lastCustomAt) / 1000),
            engaged: engaged, paywall: pwSeenAt ? (pwDecided ? "decided" : "left") : "no",
            visit: visits, src: store.src || ""};
  };
  window.TEL = {
    chat: function(userMsg, reply, meta){
      push("chat", "message", {u: String(userMsg).slice(0, 800), r: String(reply).slice(0, 1200), ...(meta || {})});
    },
    feedback: function(score, note){
      push("feedback", "rating", {score: score, note: String(note || "").slice(0, 500)});
    },
    ev: function(name, value){ lastCustom = String(name || ""); lastCustomAt = Date.now(); push("custom", name, value); },
    paywall_seen: paywallSeen,
    paywall: paywallDecision,
    ad: function(state, meta){ push("ad_" + state, meta && meta.slot || "slot", meta || ""); },
    promo: function(dest){ push("cross_promo_click", dest, {from: lastCustom || ""}); },
    play_start: function(meta){ push("play_start", "play", meta || ""); },
    play_end: function(meta, dur){ push("play_end", "play", meta || "", dur || 0); },
    flush: flush
  };
})();
</script>
