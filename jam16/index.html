<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b1a">
<title>Jam Skeleton</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060f; color: #e8e3ff;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; inset: auto 0 8px 0; text-align: center;
    font-size: 12px; opacity: 0.35; pointer-events: none;
    padding-bottom: env(safe-area-inset-bottom);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">arrows or drag &middot; space to start</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
