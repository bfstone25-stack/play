; Export presets. The load-bearing line in this file appears three times:
;
;     exclude_filter="...,assets/plates_x/*"
;
; on both Web presets. The uncensored plates are not censored in the free browser build —
; they are not in it. tools/pack_audit.sh exports the web build and greps the .pck to prove
; it, and refuses to pass if any byte of assets/plates_x/ made it in.

