/* ============ 移动 & 碰撞 ============ */
const keys={};
let inDialog=false;
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"){if(e.key==="Enter")say();return;}
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())||"wasd".includes(k))e.preventDefault();
 if(e.key===" "||e.key==="Enter"){interact();return;}
 keys[k]=true;
});
document.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
function dirInput(){
 if(keys["arrowup"]||keys["w"])return"up";if(keys["arrowdown"]||keys["s"])return"down";
 if(keys["arrowleft"]||keys["a"])return"left";if(keys["arrowright"]||keys["d"])return"right";return null;}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function npcAt(c,r){return npcs.find(n=>n.c===c&&n.r===r);}
function stepPlayer(){
 if(player.moving){
  player.mt+=0.14;player.phase+=0.35;
  if(player.mt>=1){player.mt=0;player.moving=false;player.c=player.mx;player.r=player.my;player.x=player.c;player.y=player.r;}
  else{player.x=player.c+(player.mx-player.c)*player.mt;player.y=player.r+(player.my-player.r)*player.mt;}
  return;
 }
 if(inDialog){autoPath=[];pendingNPC=null;return;}
 const d=dirInput();
 if(!d){stepAuto();return;}
 autoPath=[];pendingNPC=null; // 键盘输入取消自动寻路
 player.dir=d;const[dc,dr]=DV[d];const nc=player.c+dc,nr=player.r+dr;
 if(solid(nc,nr)||npcAt(nc,nr))return;
 player.mx=nc;player.my=nr;player.moving=true;player.mt=0;
}
function adjacentNPC(){
 for(const[dc,dr]of[[0,-1],[0,1],[-1,0],[1,0]]){const n=npcAt(player.c+dc,player.r+dr);if(n)return n;}
 return null;
}

/* ============ 点击寻路（BFS） ============ */
let autoPath=[];      // 待走的格子队列 [[c,r],...]
let pendingNPC=null;  // 走到后要对话的NPC
function walkable(c,r){return !solid(c,r)&&!npcAt(c,r);}
function bfsPath(sc,sr,goals){ // goals: Set("c,r")；返回不含起点的路径
 if(goals.has(sc+","+sr))return[];
 const prev=new Map(),q=[[sc,sr]];prev.set(sc+","+sr,null);
 while(q.length){
  const[c,r]=q.shift();
  for(const[dc,dr]of[[0,-1],[0,1],[-1,0],[1,0]]){
   const nc=c+dc,nr=r+dr,k=nc+","+nr;
   if(prev.has(k)||!walkable(nc,nr))continue;
   prev.set(k,c+","+r);
   if(goals.has(k)){ // 回溯
    const path=[];let cur=k;
    while(cur&&cur!==sc+","+sr){path.unshift(cur.split(",").map(Number));cur=prev.get(cur);}
    return path;
   }
   q.push([nc,nr]);
  }
 }
 return null;
}
function faceAndTalk(n){ // 面向NPC并触发对话
 const dc=n.c-player.c,dr=n.r-player.r;
 player.dir=dc===1?"right":dc===-1?"left":dr===-1?"up":"down";
 interact();
}
function goTo(tc,tr,npc){ // 设定自动寻路目标
 pendingNPC=npc||null;
 let goals;
 if(npc){ // 目标=NPC四邻可走格；若已相邻直接对话
  if(Math.abs(npc.c-player.c)+Math.abs(npc.r-player.r)===1){autoPath=[];faceAndTalk(npc);return;}
  goals=new Set();
  for(const[dc,dr]of[[0,-1],[0,1],[-1,0],[1,0]])if(walkable(npc.c+dc,npc.r+dr))goals.add((npc.c+dc)+","+(npc.r+dr));
 }else if(walkable(tc,tr)){goals=new Set([tc+","+tr]);}
 else{ // 不可走格→其可走相邻格中取一
  goals=new Set();
  for(const[dc,dr]of[[0,-1],[0,1],[-1,0],[1,0]])if(walkable(tc+dc,tr+dr))goals.add((tc+dc)+","+(tr+dr));
 }
 if(!goals||goals.size===0){pendingNPC=null;return;}
 const p=bfsPath(player.c,player.r,goals);
 if(p===null){pendingNPC=null;return;} // 不可达
 autoPath=p;
}
function stepAuto(){ // 每帧：无键盘输入且有路径时走下一格
 if(!autoPath.length){
  if(pendingNPC){const n=pendingNPC;pendingNPC=null;
   if(Math.abs(n.c-player.c)+Math.abs(n.r-player.r)===1)faceAndTalk(n);}
  return;
 }
 const[nc,nr]=autoPath[0];
 if(!walkable(nc,nr)){autoPath=[];pendingNPC=null;return;} // 路被堵
 autoPath.shift();
 player.dir=nc>player.c?"right":nc<player.c?"left":nr>player.r?"down":"up";
 player.mx=nc;player.my=nr;player.moving=true;player.mt=0;
}

/* ============ 气泡（DOM 跟随） ============ */
const bubLayer=document.getElementById("bubbles");
const bubEls=new Map(); // owner -> el
function bubbleFor(owner){
 let el=bubEls.get(owner);
 if(!el){el=document.createElement("div");el.className="bub"+(owner===player?" player":"");bubLayer.appendChild(el);bubEls.set(owner,el);}
 return el;
}
let typing=null;
function showBubble(owner,txt,opts={}){
 const el=bubbleFor(owner);
 el.classList.toggle("gray",!!opts.gray);
 el.classList.add("show");
 clearTimeout(el._hideT);
 if(opts.type){
  clearInterval(typing);let i=0;const c='<span class="cursor"></span>';
  el.innerHTML=c;
  typing=setInterval(()=>{i++;el.innerHTML=esc(txt.slice(0,i))+(i<txt.length?c:"");if(i>=txt.length)clearInterval(typing);},24);
 }else el.innerHTML=esc(txt);
 if(opts.ttl)el._hideT=setTimeout(()=>el.classList.remove("show"),opts.ttl);
}
function hideBubble(owner){const el=bubEls.get(owner);if(el){clearInterval(typing);el.classList.remove("show");}}
function esc(s){return s.replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]));}
function placeBubbles(){
 const rect=cv.getBoundingClientRect(),wrap=document.getElementById("stageWrap").getBoundingClientRect();
 const shown=[];
 for(const[owner,el]of bubEls){
  if(!el.classList.contains("show"))continue;
  const[px,py]=worldXY(owner);
  const ax=Math.max(70,Math.min(wrap.width-70,(rect.left-wrap.left)+px*scale));
  const ay=Math.max(el.offsetHeight+4,(rect.top-wrap.top)+(py-34)*scale);
  shown.push({owner,el,ax,ay,dx:0,w:el.offsetWidth,h:el.offsetHeight});
 }
 // 重叠的气泡水平错开, 各让一半
 for(let i=0;i<shown.length;i++)for(let j=i+1;j<shown.length;j++){
  const a=shown[i],b=shown[j];
  const overX=(a.w+b.w)/2-Math.abs((a.ax+a.dx)-(b.ax+b.dx));
  const overY=Math.min(a.ay,b.ay)-Math.max(a.ay-a.h,b.ay-b.h);
  if(overX>0&&overY>0){
   let l=a,r=b;
   if(b.ax<a.ax||(b.ax===a.ax&&b.owner!==player)){l=b;r=a;}
   const push=overX/2+8;l.dx-=push;r.dx+=push;
  }
 }
 for(const s of shown){
  s.x=Math.max(s.w/2+4,Math.min(wrap.width-s.w/2-4,s.ax+s.dx));
 }
 // 窄屏水平让不开时, 把上方气泡再抬高避开
 for(let i=0;i<shown.length;i++)for(let j=i+1;j<shown.length;j++){
  const a=shown[i],b=shown[j];
  const overX=(a.w+b.w)/2-Math.abs(a.x-b.x);
  const overY=Math.min(a.ay,b.ay)-Math.max(a.ay-a.h,b.ay-b.h);
  if(overX>0&&overY>0){
   const[up,low]=a.ay<=b.ay?[a,b]:[b,a];
   up.ay=Math.max(up.h+4,low.ay-low.h-6);
  }
 }
 for(const s of shown){
  s.el.style.left=s.x+"px";s.el.style.top=s.ay+"px";
  // 尾巴仍指向说话者头顶
  const tail=Math.max(12,Math.min(s.w-12,s.w/2+(s.ax-s.x)));
  s.el.style.setProperty("--tailX",tail+"px");
 }
}

/* ============ 对话系统（API 契约沿用旧版） ============ */
function interact(){
 if(inDialog||done)return;
 const n=adjacentNPC();if(!n)return;
 n.dir=({up:"down",down:"up",left:"right",right:"left"})[player.dir]||"down";
 if(n.isBoss)enterDialog();
 else showBubble(n,n.lines[lang]||n.lines.zh||n.lines.en,{type:true,ttl:4200});
}
function enterDialog(){
 if(!S)return;
 inDialog=true;
 motif("question");
 document.getElementById("inputBar").classList.add("on");
 document.getElementById("turnsBox").style.display="flex";
 setHint(talkHint());
 if(coachKind==="town")dismissCoach();
 else if(!localStorage.getItem("st_guide_town"))localStorage.setItem("st_guide_town","1");
 maybeTalkCoach();
 if(hist.length===0)showBubble(boss,tr().opening(S.character),{type:true});
 else showBubble(boss,hist[hist.length-1].content,{type:true});
 setTimeout(()=>document.getElementById("inp").focus(),50);
}
function exitDialog(){
 inDialog=false;
 document.getElementById("inputBar").classList.remove("on");
 setHint(walkHint());
 hideBubble(boss);hideBubble(player);
 document.getElementById("inp").blur();
}
function updateBar(){
 document.getElementById("moves").textContent=tr().moves(turns,S.max_turns);
 let p="";for(let i=0;i<S.max_turns;i++)p+=`<div class="pip ${i<turns?'used':''}"></div>`;
 document.getElementById("pips").innerHTML=p;
}
async function say(){
 if(done||!S||turns>=S.max_turns)return;
 const inp=document.getElementById("inp"),msg=inp.value.trim();if(!msg)return;
 inp.value="";document.getElementById("send").disabled=true;turns++;updateBar();track("line_sent",{line_number:turns});
 showBubble(player,msg,{});           // 玩家头顶气泡
 showBubble(boss,tr().wait,{});       // 等待中
 try{
  const r=await (await fetch(API+"/say",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({history:hist,message:msg,lang:lang,pid:pid(),difficulty,challenge_day:S.day,mode:mode})})).json();
  hist.push({role:"user",content:msg});hist.push({role:"assistant",content:r.reply||"…"});
  motif(r.won?"win":"reply");
  showBubble(boss,r.reply||"…",{type:true});
  turns=r.turns||turns;updateBar();
  if(window.TEL)TEL.chat(msg,r.reply||"",{scenario:S.id,turns:r.turns||turns,won:!!r.won});
  const phase=(r.read&&r.read.phase)||"";
  if(!r.won && !r.over && phase==="guarded" && (r.turns||turns)>=2 && tr().nudgeHint && S.goal){
    setHint(tr().nudgeHint(S.goal),true);
    track("offtopic_nudge",{turns:r.turns||turns,phase});
  }else if(!r.won){setHint(talkHint());}
  if(r.won){done=true;track("duel_won",{elapsed_s:Math.round((Date.now()-gameStartedAt)/1000)});setTimeout(()=>win(r.turns),900);}
  else if(r.over){done=true;track("duel_lost",{elapsed_s:Math.round((Date.now()-gameStartedAt)/1000)});setTimeout(lose,900);}
 }catch(e){showBubble(boss,"(connection error)",{gray:true,ttl:3000});track("line_error",{});}
 document.getElementById("send").disabled=false;
}

/* ============ 胜负 ============ */

 exitDialog();

/* ============ 游戏反馈（每日一次，fire-and-forget） ============ */
function fbHTML(){
 if(!API)return"";
 if(localStorage.getItem("st_fb_last")===new Date().toISOString().slice(0,10))return"";
 const q=lang==="zht"?"今天這局怎麼樣?":isZh()?"今天这局怎么样?":"How was today's duel?";
 return `<div id="fbBox" style="margin-top:16px;padding:10px 16px;border:1px solid #5a4a3a;border-radius:12px;background:rgba(240,205,136,.06)">
  <span style="color:#c9b48f;font-size:.9em;margin-right:8px">${q}</span>
  <button onclick="sendFb(3)" style="background:none;border:none;font-size:1.4em;cursor:pointer">😍</button>
  <button onclick="sendFb(2)" style="background:none;border:none;font-size:1.4em;cursor:pointer">😐</button>
  <button onclick="sendFb(1)" style="background:none;border:none;font-size:1.4em;cursor:pointer">🥱</button>
 </div>`;
}
function postFb(score,note){
 try{fetch(API+"/feedback",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({score,note:note||"",pid:pid(),lang,scenario:S?.id||"",turns})}).catch(()=>{});}catch(e){}
 if(window.TEL)TEL.feedback(score,note||"");
}
function sendFb(score){
 localStorage.setItem("st_fb_last",new Date().toISOString().slice(0,10));
 postFb(score,"");
 const box=document.getElementById("fbBox");if(!box)return;
 const thx=lang==="zht"?"謝謝!":isZh()?"谢谢!":"Thanks!";
 const ph=lang==="zht"?"想說一句?(可選)":isZh()?"想说一句?(可选)":"One more thought? (optional)";
 box.innerHTML=`<span style="color:#f0cd88;font-size:.9em">${thx}</span>
  <input id="fbNote" maxlength="200" placeholder="${ph}" style="margin-left:8px;background:rgba(255,255,255,.08);border:1px solid #5a4a3a;border-radius:8px;color:#f5f0e0;padding:5px 9px;font-size:.85em;width:190px"
   onkeydown="if(event.key==='Enter')sendFbNote(${score})">
  <button onclick="sendFbNote(${score})" style="margin-left:6px;background:#5a4a3a;border:none;border-radius:8px;color:#f0cd88;padding:5px 11px;cursor:pointer;font-size:.85em">${lang==="zht"?"發送":isZh()?"发送":"Send"}</button>`;
 const inp=document.getElementById("fbNote");if(inp)inp.focus();
}
function sendFbNote(score){
 const inp=document.getElementById("fbNote");const note=inp?inp.value.trim():"";
 if(note)postFb(score,note);
 const box=document.getElementById("fbBox");
 if(box)box.innerHTML=`<span style="color:#f0cd88;font-size:.9em">${lang==="zht"?"謝謝!":isZh()?"谢谢!":"Thanks!"} 🙏</span>`;
}
function share(n,grid){const txt=`舌战 Silvertongue · Day ${S.day}\n${S.goal}\n${grid}  ${isZh()?n+(lang==="zht"?"句":"句"):n+" lines"}\n${location.href.split("?")[0]}`;
 navigator.clipboard.writeText(txt);alert(tr().copied);}

/* ============ WebAudio 合成音效（零音频文件） ============ */
let AC=null,MASTER=null,MUSIC_BUS=null,AMBIENCE_BUS=null,SFX_BUS=null,ambienceStarted=false,themeTimer=null,themePlaying=false;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MUSIC_BUS=AC.createGain();AMBIENCE_BUS=AC.createGain();SFX_BUS=AC.createGain();MUSIC_BUS.connect(MASTER);AMBIENCE_BUS.connect(MASTER);SFX_BUS.connect(MASTER);MASTER.connect(AC.destination);applyAudioLevels();}if(AC.state==="suspended")AC.resume();return AC;}
function applyAudioLevels(){initMediaAudio();THEME_AUDIO.volume=Math.max(0,Math.min(1,AUDIO_CFG.master*AUDIO_CFG.music));GAME_AUDIO.volume=Math.max(0,Math.min(1,AUDIO_CFG.master*AUDIO_CFG.music*.62));if(!MASTER)return;MASTER.gain.value=AUDIO_CFG.master;MUSIC_BUS.gain.value=0;AMBIENCE_BUS.gain.value=0;SFX_BUS.gain.value=AUDIO_CFG.sfx;}
function startGameplayMusic(){initMediaAudio();applyAudioLevels();GAME_AUDIO.currentTime=0;GAME_AUDIO.play().catch(()=>{});}
function stopGameplayMusic(){if(GAME_AUDIO){GAME_AUDIO.pause();GAME_AUDIO.currentTime=0;}}
function fadeThemeOut(){
 initMediaAudio();
 const start=THEME_AUDIO.volume,themeTarget=Math.max(0,Math.min(1,AUDIO_CFG.master*AUDIO_CFG.music)),gameTarget=Math.max(0,Math.min(1,AUDIO_CFG.master*AUDIO_CFG.music*.62));let step=0;
 GAME_AUDIO.currentTime=0;GAME_AUDIO.volume=0;GAME_AUDIO.play().catch(()=>{});
 const fade=setInterval(()=>{step++;THEME_AUDIO.volume=Math.max(0,start*(1-step/15));GAME_AUDIO.volume=gameTarget*(step/15);if(step>=15){clearInterval(fade);THEME_AUDIO.pause();THEME_AUDIO.currentTime=0;THEME_AUDIO.volume=themeTarget;GAME_AUDIO.volume=gameTarget;}},100);
}
document.addEventListener("pointerdown",()=>{try{startAudio()}catch(e){}},{once:true});
document.addEventListener("keydown",()=>{try{startAudio()}catch(e){}},{once:true});
function tone(freq,t0,dur,type,gain,bus="sfx"){
 const a=ac(),o=a.createOscillator(),g=a.createGain(),dest=bus==="music"?MUSIC_BUS:SFX_BUS;
 o.type=type;o.frequency.value=freq;o.connect(g);g.connect(dest);
 g.gain.setValueAtTime(0,a.currentTime+t0);
 g.gain.linearRampToValueAtTime(gain,a.currentTime+t0+.02);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+dur);
 o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05);
}
function motif(kind){
 const notes={arrival:[369.99,440,554.37,493.88],question:[440,466.16],reply:[554.37,493.88,440],win:[369.99,440,554.37,659.25],lose:[440,415.3,329.63]}[kind]||[];
 try{notes.forEach((f,i)=>tone(f,i*.115,.3,kind==="lose"?"sawtooth":"triangle",kind==="question"?.04:.065,"sfx"));}catch(e){}
}
function musicNote(freq,when,dur,gain=.05,voice="reed"){
 const a=ac(),g=a.createGain(),o1=a.createOscillator(),o2=a.createOscillator(),f=a.createBiquadFilter();
 o1.type=voice==="pluck"?"triangle":"sine";o2.type=voice==="pluck"?"sine":"triangle";
 o1.frequency.value=freq;o2.frequency.value=freq*2;o2.detune.value=voice==="reed"?7:0;
 f.type="lowpass";f.frequency.value=voice==="pluck"?1600:1100;o1.connect(f);o2.connect(f);f.connect(g);g.connect(MUSIC_BUS);
 const t=a.currentTime+when;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.025);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);o1.start(t);o2.start(t);o1.stop(t+dur+.04);o2.stop(t+dur+.04);
}
function playTheme(){
 if(themePlaying||AUDIO_CFG.music<=0)return;themePlaying=true;const beat=.285;
 // Original "Silver Waltz": a 6/8 conversational melody in E minor that
 // alternates question/answer phrases, then turns into a brighter G-major close.
 const melody=[64,67,71,69,67,66,64,67,71,74,71,69,67,71,76,74,71,69,
  66,69,74,72,69,67,64,67,71,69,66,62,67,71,74,79,78,74,
  71,74,79,81,79,78,76,74,71,69,71,74,76,79,83,81,79,76,
  74,71,69,67,71,74,79,78,76,74,71,67,69,71,74,72,71,67];
 const bass=[40,47,43,50,45,52,40,47,43,50,47,54];
 const midi=n=>440*Math.pow(2,(n-69)/12);
 try{
  melody.forEach((n,i)=>musicNote(midi(n),i*beat,i%6===5?beat*.92:beat*.72,i>47?.052:.045,"reed"));
  bass.forEach((n,i)=>{const t=i*6*beat;musicNote(midi(n),t,beat*.8,.05,"pluck");musicNote(midi(n+7),t+2*beat,beat*.55,.025,"pluck");musicNote(midi(n+12),t+4*beat,beat*.55,.022,"pluck");});
  [64,67,71,74].forEach((n,i)=>musicNote(midi(n),melody.length*beat-.9+i*.11,1.25,.026,"reed"));
 }catch(e){}
 setTimeout(()=>{themePlaying=false},Math.ceil((melody.length*beat+1.5)*1000));
}
function startAudio(){
 initMediaAudio();ac();AUDIO_CFG.ambience=0;if(AMBIENCE_BUS)AMBIENCE_BUS.gain.value=0;
 applyAudioLevels();THEME_AUDIO.play().catch(()=>{});
}
function winSound(){ // 胜利琶音 C5-E5-G5-C6 + 尾音和弦
 try{[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.18));
 tone(1046.5,.5,.7,"sine",.14);tone(1318.5,.5,.7,"sine",.1);}catch(e){}
}
function loseSound(){try{tone(196,0,.4,"sawtooth",.1);tone(147,.25,.6,"sawtooth",.09);}catch(e){}}

/* ============ 虚拟十字键（pointer：触屏+鼠标通用） ============ */
const isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
const dpadEl=document.getElementById("dpad");
function dpadPref(){const v=localStorage.getItem("st_dpad");return v===null?isTouch:v==="1";}
function applyDpad(on){dpadEl.classList.toggle("on",on);}
applyDpad(dpadPref());
function bindD(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture&&el.setPointerCapture(e.pointerId);keys[key]=true;});
 el.addEventListener("pointerup",e=>{e.preventDefault();keys[key]=false;});
 el.addEventListener("pointercancel",()=>{keys[key]=false;});
 el.addEventListener("pointerleave",()=>{keys[key]=false;});
}
bindD("dU","arrowup");bindD("dD","arrowdown");bindD("dL","arrowleft");bindD("dR","arrowright");
document.getElementById("dA").addEventListener("pointerdown",e=>{e.preventDefault();interact();});
// 右下角 d-pad 显隐切换按钮
document.getElementById("dpadToggle").addEventListener("click",()=>{
 const on=!dpadEl.classList.contains("on");
 applyDpad(on);localStorage.setItem("st_dpad",on?"1":"0");
});
/* ============ 点击/点按地图：寻路移动 & 点NPC对话 ============ */
cv.addEventListener("pointerdown",e=>{
 if(inDialog||done)return; // 对话模式点击地图不移动（防误触）
 e.preventDefault();
 const rect=cv.getBoundingClientRect(); // CSS缩放换算到逻辑格
 const wx=(e.clientX-rect.left)*(W/rect.width),wy=(e.clientY-rect.top)*(H/rect.height);
 const c=Math.floor(wx/TS),r=Math.floor(wy/TS);
 if(c<0||r<0||c>=COLS||r>=ROWS)return;
 const n=npcAt(c,r);
 goTo(c,r,n); // 有NPC→走到相邻并对话；否则走到该格/最近可达邻格；再点新目标自动替换旧路径
});

 buildGround();updateBar();renderHome();gameStartedAt=Date.now();track("challenge_loaded",{difficulty});

<script>
// 统一埋点SDK: 自动记录pageview/click/停留/会话时长, 手动记录chat/feedback
(function(){
  const API = window.SILVERTONGUE_API || window.APP_API || "";
  const pid = (function(){let p=localStorage.getItem("tel_pid");
    if(!p){p="u"+Math.random().toString(36).slice(2,10);localStorage.setItem("tel_pid",p);}return p;})();
  const sid = "s"+Math.random().toString(36).slice(2,10);
  const t0 = Date.now();
  let queue = [];
  function push(etype,name,value,dur){
    queue.push({pid,sid,etype,name:String(name||"").slice(0,120),
                value:typeof value==="string"?value:JSON.stringify(value||""),dur:dur||0});
    if(queue.length>=8) flush();
  }
  function flush(useBeacon){
    if(!queue.length||!API) return;
    const batch = queue.splice(0,50);
    const body = JSON.stringify(batch);
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(API+"/tel_batch", new Blob([body],{type:"application/json"}));
    } else {
      fetch(API+"/tel_batch",{method:"POST",headers:{"Content-Type":"application/json"},body}).catch(()=>{});
    }
  }
  // 自动: pageview
  push("pageview", location.pathname||"/", document.title||"");
  // 自动: 所有click(记录元素id/class/文本)
  document.addEventListener("click", e=>{
    const el=e.target.closest("button,a,[data-tel],.card,.chip,[role=button]");
    if(!el)return;
    push("click", el.id||el.dataset.tel||el.className||el.tagName,
         (el.innerText||"").trim().slice(0,60));
  }, true);
  // 自动: 会话时长(离开时上报)
  window.addEventListener("beforeunload", ()=>{
    push("session_end","session","",Math.round((Date.now()-t0)/1000));
    flush(true);
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(true); });
  setInterval(()=>flush(), 20000);   // 定期flush
  // 暴露手动埋点: TEL.chat(用户消息,回复) / TEL.feedback(分数,留言) / TEL.ev(类型,名,值)
  window.TEL = {
    chat: (userMsg, reply, meta)=>push("chat","message",{u:String(userMsg).slice(0,800),r:String(reply).slice(0,1200),...(meta||{})}),
    feedback: (score, note)=>push("feedback","rating",{score,note:String(note||"").slice(0,500)}),
    ev: (name, value)=>push("custom",name,value),
    flush
  };
})();
</script>
