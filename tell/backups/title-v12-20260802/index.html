async function authGoogle(result){try{const r=await fetch(API+"/auth/google",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:result.credential,anonymous_pid:pid()})});if(!r.ok)throw Error();AUTH.me=await r.json();track("optional_login_completed",{provider:"google"});renderAuthButton();renderAuth();}catch(e){const m=document.getElementById("authMsg");if(m)m.textContent=authText().failed}}

function fadeScore(player,to,ms,done){if(!player)return;const from=player.volume,start=performance.now();player.__fadeId=(player.__fadeId||0)+1;const fadeId=player.__fadeId;function step(now){if(player.__fadeId!==fadeId)return;const p=Math.min(1,(now-start)/ms);player.volume=Math.max(0,Math.min(1,from+(to-from)*(p*(2-p))));if(p<1)requestAnimationFrame(step);else if(done)done()}requestAnimationFrame(step)}
function playScore(scene,returnTo){
 const src=SCORE_PATHS[scene];if(!src)return;
 if(SCORE.requested===scene&&SCORE.player&&!SCORE.player.paused)return;
 const request=++SCORE.request,old=SCORE.player,next=new Audio(src);
 SCORE.requested=scene;next.preload="auto";next.loop=scene==="menu"||scene==="interrogation";next.volume=0;
 if(!next.loop)next.addEventListener("ended",()=>{if(SCORE.player===next)playScore(returnTo||"interrogation")},{once:true});
 next.play().then(()=>{
  if(request!==SCORE.request){next.pause();next.src="";return}
  SCORE.player=next;SCORE.scene=scene;fadeScore(next,scoreVolume(),900);
  if(old&&old!==next)fadeScore(old,0,650,()=>{old.pause();old.src=""});
 }).catch(()=>{if(request===SCORE.request)SCORE.requested=SCORE.scene});
}
function stopScore(ms=420){
 ++SCORE.request;SCORE.requested="";SCORE.scene="";
 const old=SCORE.player;SCORE.player=null;
 if(old)fadeScore(old,0,ms,()=>{old.pause();old.src=""});
}
const AUDIO={ctx:null,master:null,music:null,ambience:null,sfx:null,reverb:null,wet:null,started:false,menuAwake:false};
function initAudio(){if(AUDIO.ctx){if(AUDIO.ctx.state==="suspended")AUDIO.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=AUDIO.ctx=new AC(),lim=c.createDynamicsCompressor();lim.threshold.value=-18;lim.knee.value=18;lim.ratio.value=4;lim.attack.value=.015;lim.release.value=.5;AUDIO.master=c.createGain();AUDIO.music=c.createGain();AUDIO.ambience=c.createGain();AUDIO.sfx=c.createGain();AUDIO.reverb=c.createConvolver();AUDIO.wet=c.createGain();AUDIO.wet.gain.value=.32;const impulse=c.createBuffer(2,c.sampleRate*3.4,c.sampleRate);for(let ch=0;ch<2;ch++){const d=impulse.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8)}AUDIO.reverb.buffer=impulse;AUDIO.music.connect(AUDIO.master);AUDIO.music.connect(AUDIO.reverb);AUDIO.reverb.connect(AUDIO.wet);AUDIO.wet.connect(AUDIO.master);AUDIO.ambience.connect(AUDIO.master);AUDIO.sfx.connect(AUDIO.master);AUDIO.master.connect(lim);lim.connect(c.destination);applyCfg();}
function tone(freq,at,dur,gain=.08,type="sine",bus="music",cutoff=1200,detune=0){if(!AUDIO.ctx)return;const c=AUDIO.ctx,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),sh=c.createWaveShaper();o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*.992,at+dur);o.detune.value=detune;f.type=type==="sawtooth"?"bandpass":"lowpass";f.frequency.value=cutoff;f.Q.value=type==="sawtooth"?2.8:.7;const curve=new Float32Array(512);for(let i=0;i<curve.length;i++){const x=i*2/(curve.length-1)-1;curve[i]=Math.tanh(x*(type==="sawtooth"?4.8:1.2))}sh.curve=curve;sh.oversample="4x";g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(gain,at+.055);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(sh);sh.connect(f);f.connect(g);g.connect(AUDIO[bus]);o.start(at);o.stop(at+dur+.08)}
function startAmbience(){initAudio();if(!AUDIO.ctx||AUDIO.started)return;AUDIO.started=true;const c=AUDIO.ctx,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=43;g.gain.value=.018;o.connect(g);g.connect(AUDIO.ambience);o.start();const b=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.16;const src=c.createBufferSource(),flt=c.createBiquadFilter(),ng=c.createGain();src.buffer=b;src.loop=true;flt.type="lowpass";flt.frequency.value=420;ng.gain.value=.055;src.connect(flt);flt.connect(ng);ng.connect(AUDIO.ambience);src.start()}
function wakeMenuAudio(){if(AUDIO.menuAwake)return;AUDIO.menuAwake=true;initAudio();startAmbience();playScore("menu");}
function paperSound(){initAudio();if(!AUDIO.ctx)return;const c=AUDIO.ctx,b=c.createBuffer(1,c.sampleRate*.22,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=1500;g.gain.value=.08;s.connect(f);f.connect(g);g.connect(AUDIO.sfx);s.start()}
function uiSound(){initAudio();if(!AUDIO.ctx)return;tone(92,AUDIO.ctx.currentTime,.12,.035,"square","sfx")}

    if(!p){p="u"+Math.random().toString(36).slice(2,10);localStorage.setItem("tel_pid",p);}return p;})();
  const sid = "s"+Math.random().toString(36).slice(2,10);
  const t0 = Date.now();
  let queue = [];
  function push(etype,name,value,dur){
    queue.push({pid,sid,etype,name:String(name||"").slice(0,120),
                value:typeof value==="string"?value:JSON.stringify(value||""),dur:dur||0});
    if(queue.length>=8) flush();
  }
  function flush(useBeacon){
    if(!queue.length||!API) return;
    const batch = queue.splice(0,50);
    const body = JSON.stringify(batch);
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(API+"/tel_batch", new Blob([body],{type:"application/json"}));
    } else {
      fetch(API+"/tel_batch",{method:"POST",headers:{"Content-Type":"application/json"},body}).catch(()=>{});
    }
  }
  // 自动: pageview
  push("pageview", location.pathname||"/", document.title||"");
  // 自动: 所有click(记录元素id/class/文本)
  document.addEventListener("click", e=>{
    const el=e.target.closest("button,a,[data-tel],.card,.chip,[role=button]");
    if(!el)return;
    push("click", el.id||el.dataset.tel||el.className||el.tagName,
         (el.innerText||"").trim().slice(0,60));
  }, true);
  // 自动: 会话时长(离开时上报)
  window.addEventListener("beforeunload", ()=>{
    push("session_end","session","",Math.round((Date.now()-t0)/1000));
    flush(true);
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(true); });
  setInterval(()=>flush(), 20000);   // 定期flush
  // 暴露手动埋点: TEL.chat(用户消息,回复) / TEL.feedback(分数,留言) / TEL.ev(类型,名,值)
  window.TEL = {
    chat: (userMsg, reply, meta)=>push("chat","message",{u:String(userMsg).slice(0,800),r:String(reply).slice(0,1200),...(meta||{})}),
    feedback: (score, note)=>push("feedback","rating",{score,note:String(note||"").slice(0,500)}),
    ev: (name, value)=>push("custom",name,value),
    flush
  };
})();
</script>


<script>
/* 通用等待动画: 任何异步请求期间显示"思考中"呼吸提示, 零服务器成本 */
(function(){
  let _wt=null;
  const HINTS={zh:["正在思考…","整理中…","正在分析…","稍等一下…"],
               en:["thinking…","working on it…","analyzing…","one moment…"]};
  window.showWaiting=function(elId){
    const el=document.getElementById(elId)||document.querySelector("[data-wait]")||document.body;
    const zh=(document.documentElement.lang||navigator.language||"").toLowerCase().startsWith("zh");
    const hints=zh?HINTS.zh:HINTS.en;
    let d=0,hi=Math.floor(Math.random()*hints.length);
    window._waitEl=el; window._waitPrev=el.innerHTML;
    _wt=setInterval(()=>{d=(d+1)%4;
      el.innerHTML=`<div style="opacity:.6;font-style:italic;padding:12px">${hints[hi]}${".".repeat(d)}</div>`;
      if(d===0&&Math.random()<0.3)hi=(hi+1)%hints.length;},520);
  };
  window.hideWaiting=function(){if(_wt){clearInterval(_wt);_wt=null;}};
})();
</script>

<script>
/* 评价UI - 跟随界面语言(避免英文界面出现中文) */
(function(){
  function currentLanguage(){
    // 1. app自己的语言状态(最可靠)
    try{ if(typeof lang!=="undefined") return String(lang).toLowerCase().slice(0,2); }catch(e){}
    try{ const ls=localStorage.getItem("tell_lang")||localStorage.getItem("lang")||localStorage.getItem("locale");
         if(ls) return ls.toLowerCase().slice(0,2); }catch(e){}
    // 2. URL参数
    const u=new URLSearchParams(location.search).get("lang");
    if(u) return u.toLowerCase().slice(0,2);
    // 3. html lang属性
    const h=(document.documentElement.lang||"").toLowerCase();
    if(h) return h.slice(0,2);
    // 4. 兜底: 浏览器语言(不再扫描页面中文,避免误判)
    return (navigator.language||"en").toLowerCase().slice(0,2);
  }
  const T={
    zh:{btn:"案卷评价",q:"本案体验如何？",ph:"留下您的调查意见……（可选）",send:"提交记录",done:"意见已归档，谢谢"},
    en:{btn:"CASE REVIEW",q:"How was this investigation?",ph:"Leave a field note… (optional)",send:"FILE REPORT",done:"Report filed. Thank you."},
    es:{btn:"REVISAR CASO",q:"¿Cómo fue la investigación?",ph:"Deja una nota de campo… (opcional)",send:"ARCHIVAR INFORME",done:"Informe archivado. Gracias."},
    pt:{btn:"REVISAR CASO",q:"Como foi a investigação?",ph:"Deixe uma nota de campo… (opcional)",send:"ARQUIVAR RELATO",done:"Relato arquivado. Obrigado."},
    ja:{btn:"事件評価",q:"今回の捜査はいかがでしたか？",ph:"捜査メモを残す…（任意）",send:"記録を提出",done:"記録を保管しました。ありがとう。"}
  };
  window.uxT=function(){return T[currentLanguage()]||T.en;};
  window.uxSyncLabels=function(){
    const t=uxT(), b=document.getElementById("uxFbBtn");
    if(b)b.textContent=t.btn;
  };
  document.addEventListener("DOMContentLoaded",uxSyncLabels);
  setTimeout(uxSyncLabels,300);
})();
let uxScore=0;

 document.getElementById("uxFbEmos").innerHTML=es.map(([e,s])=>
