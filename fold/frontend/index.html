<style>

@media(prefers-reduced-motion:reduce){.foldField *,.introCard:before,.introCard h2,.wordmark-east *{animation:none!important}.wordmark-east .fold-plane{opacity:1}.wordmark-east .seal{opacity:.92}}
</style></head><body>

<script>
// ---------- 关卡(手工设计,确定性;后续RL无限生成) ----------
// grid: 行数组; 数字=初始块值, 'x'=墙, 0=空. target=归一目标值. par=满星步数.
let LEVELS = [
 {name:"入门 / Warmup", target:4, par:1, grid:[[2,2]]},
 {name:"折返 / Corner", target:8, par:2, grid:[[2,2,0],[0,2,2]]},
 {name:"夹墙 / Walls", target:8, par:2, grid:[[2,'x',2],[2,0,2]]},
 {name:"四合 / Fourfold", target:8, par:2, grid:[[2,2],[2,2]]},
 {name:"孤岛 / Island", target:16, par:2, grid:[[4,0,4],[0,0,0],[4,0,4]]},
 {name:"八合 / Octet", target:32, par:3, grid:[[4,4,4,4],[0,0,0,0],[4,4,4,4]]},
 {name:"阶梯 / Ladder", target:16, par:5, grid:[[2,2,2],[2,0,2],[2,2,2]]},
 {name:"迷宫 / Maze", target:16, par:5, grid:[[2,2,'x',4],[0,'x',0,4],[2,2,'x',0],['x',0,0,0]]},
];
const PAL={2:'#3c4657',4:'#4a5a7a',8:'#5b7bba',16:'#c98a3e',32:'#d9a63f',64:'#e0b356',128:'#e6c674',256:'#efd98f'};
let COACH={};
const COACH_READY=fetch('coach_tips.json').then(r=>r.json()).then(d=>{COACH=d;}).catch(()=>{});
function coachTier(par){return par<=3?'easy':par<=6?'medium':par<=9?'hard':'expert';}
const COACH_FALLBACK={
 en:{easy:'The first fold is complete.',medium:'You saw the order hidden in the space.',hard:'Complexity yielded to a quiet plan.',expert:'Many possibilities, one inevitable form.'},
 es:{easy:'El primer pliegue está completo.',medium:'Viste el orden oculto en el espacio.',hard:'La complejidad cedió ante un plan sereno.',expert:'Muchas posibilidades, una forma inevitable.'},
 pt:{easy:'A primeira dobra está completa.',medium:'Você viu a ordem escondida no espaço.',hard:'A complexidade cedeu a um plano tranquilo.',expert:'Muitas possibilidades, uma forma inevitável.'},
 zh:{easy:'初折已成，两端归一。',medium:'你看见了空间里潜藏的秩序。',hard:'繁复终究让位于从容的布局。',expert:'万般可能，终成一形。'},
 ja:{easy:'初めの一折。二つの道が一つになりました。',medium:'空間に潜む秩序を見抜きました。',hard:'複雑さは、静かな構想に道を譲りました。',expert:'無数の可能性が、必然の一形へ。'}
};
let lastCoach='';
function coachLine(par){
 const tier=coachTier(par), pool=(COACH[lang]&&COACH[lang][tier])||(COACH.en&&COACH.en[tier])||[];
 const choices=pool.filter(x=>x!==lastCoach);
 const line=(choices.length?choices:pool)[Math.floor(Math.random()*Math.max(1,(choices.length?choices:pool).length))]||(COACH_FALLBACK[lang]||COACH_FALLBACK.en)[tier];
 lastCoach=line; return line;
}
const LANGS=['en','es','pt','zh','ja'];
function initialLang(){
 const saved=localStorage.getItem('fold_lang'); if(LANGS.includes(saved))return saved;
 const n=(navigator.language||'en').toLowerCase();
 if(n.startsWith('zh'))return'zh'; if(n.startsWith('ja'))return'ja';
 if(n.startsWith('es'))return'es'; if(n.startsWith('pt'))return'pt'; return'en';
}
let L=0, R, C, cells, walls, tiles, moves, hist, done, lang=initialLang();
const T={zh:{goal:t=>`目标 · 归一至 <b>${t}</b>`,moves:m=>`第 ${m} 手`,undo:"撤销",reset:"重置",
  hint:"滑动或方向键 · 同值合并 · 把所有数字归并成唯一目标块",win:"归 一",
  next:"下一关",retry:"再来",share:"晒战绩",stars:s=>["","一星","两星","满星"][s],
  support:'永久免费 · <b>永不广告</b><br>每日一局，静观万物归一',
  parhint:s=>`满星 ${s} 步`},
 ja:{goal:t=>`目標 · <b>${t}</b> へ帰一`,moves:m=>`${m} 手`,undo:"戻す",reset:"初めから",
  hint:"スワイプ／矢印キー · 同じ数を重ねる · すべてを一つに",win:"帰 一",
  next:"次へ",retry:"もう一度",share:"共有",stars:s=>["","一つ星","二つ星","満星"][s],
  support:'ずっと無料 · <b>広告なし</b><br>一日一局、万象が一へ帰すのを観る',
  parhint:s=>`満星は ${s} 手`},
 en:{goal:t=>`Fold everything into <b>${t}</b>`,moves:m=>`Move ${m}`,undo:"Undo",reset:"Reset",
  hint:"Swipe or arrows · equal tiles merge · fold all into one target tile",win:"UNITY",
  next:"Next",retry:"Retry",share:"Share",stars:s=>["","1 star","2 stars","3 stars"][s],
  support:'Free forever · <b>No ads, ever</b><br>One quiet puzzle, every day',
  parhint:s=>`${s} moves for 3★`},
 es:{goal:t=>`Pliega todo en <b>${t}</b>`,moves:m=>`Movimiento ${m}`,undo:"Deshacer",reset:"Reiniciar",
  hint:"Desliza o usa las flechas · une iguales · reduce todo a una sola ficha",win:"UNIDAD",
  next:"Siguiente",retry:"Reintentar",share:"Compartir",stars:s=>["","1 estrella","2 estrellas","3 estrellas"][s],
  support:'Gratis para siempre · <b>Sin anuncios</b><br>Un puzle sereno cada día',
  parhint:s=>`${s} movimientos para 3★`},
 pt:{goal:t=>`Dobre tudo em <b>${t}</b>`,moves:m=>`Jogada ${m}`,undo:"Desfazer",reset:"Reiniciar",
  hint:"Deslize ou use as setas · números iguais se unem · transforme tudo em uma peça",win:"UNIDADE",
  next:"Próximo",retry:"Tentar de novo",share:"Compartilhar",stars:s=>["","1 estrela","2 estrelas","3 estrelas"][s],
  support:'Grátis para sempre · <b>Sem anúncios</b><br>Um desafio tranquilo por dia',
  parhint:s=>`${s} jogadas para 3★`}};
function tr(){return T[lang]}
function load(l){
 L=l; const lv=LEVELS[l]; R=lv.grid.length; C=Math.max(...lv.grid.map(r=>r.length));
 cells=[]; walls=[]; tiles=[]; let id=0;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
   const v=lv.grid[r][c];
   if(v==='x') walls.push({r,c});
   else if(typeof v==='number'&&v>0) tiles.push({id:id++,r,c,v,merged:false,spawned:false});
 }
 moves=0; hist=[]; done=false;
 document.getElementById('lvlname').textContent=lv.name;
 document.getElementById('win').style.display='none';
 layout(); render(); renderLevels(); syncText();
 localStorage.setItem('fold_cur',l);
 if(window.TEL)TEL.ev('level_opened',{language:lang,level:l+1,group:l<51?'curated':'endless'});
}
let CS, GAP=8;
function layout(){
 const wrap=document.getElementById('app').clientWidth-32;
 const bw=Math.min(wrap, 420);
 CS=Math.floor((bw-20-GAP*(C-1))/C);
 const b=document.getElementById('board');
 b.style.width=(CS*C+GAP*(C-1)+20)+'px'; b.style.height=(CS*R+GAP*(R-1)+20)+'px';
 b.innerHTML='';

const FOLD_AUDIO=(()=>{
 let ctx=null,master=null,ambGain=null,ambNodes=[],unlocked=false;
 let sfxOn=localStorage.getItem('fold_sfx')!=='0',musicOn=localStorage.getItem('fold_music')!=='0';
 function boot(){
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume(); unlocked=true; syncSoundUI();
 }
 function tone(freq,dur=.12,gain=.035,type='sine',when=0,fall=.68){
  if(!sfxOn)return; boot(); const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*fall),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
 }
 function slide(){tone(118,.075,.018,'triangle',0,.62);}
 function invalid(){tone(74,.1,.02,'sine',0,.86);}
 function merge(n=1){for(let i=0;i<Math.min(n,3);i++)tone(196*Math.pow(1.22,i),.16,.032,'sine',i*.025,1.42);}
 function unity(stars=3){[196,247,330,494].forEach((f,i)=>tone(f,.5,.035+(i===3?.025:0),i===3?'sine':'triangle',i*.105,i===3?.98:1.12));if(stars===3)tone(988,.8,.018,'sine',.42,.5);}
 function logo(){[164,220,294,392].forEach((f,i)=>tone(f,.38,.023,i<2?'triangle':'sine',i*.09,1.02));}
 function startAmbience(){
  if(!unlocked||!musicOn||ambNodes.length)return; boot();ambGain=ctx.createGain();ambGain.gain.value=.012;ambGain.connect(master);
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=420;filter.Q.value=.7;filter.connect(ambGain);
  [55,82.5].forEach((f,i)=>{const o=ctx.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;const g=ctx.createGain();g.gain.value=i?.22:.32;o.connect(g);g.connect(filter);o.start();ambNodes.push(o,g);});
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.075;lg.gain.value=.006;lfo.connect(lg);lg.connect(ambGain.gain);lfo.start();ambNodes.push(lfo,lg,filter,ambGain);
 }
 function stopAmbience(){ambNodes.forEach(n=>{try{if(n.stop)n.stop();}catch(_){ }try{n.disconnect();}catch(_){ }});ambNodes=[];ambGain=null;}
 function setSfx(v){sfxOn=v;localStorage.setItem('fold_sfx',v?'1':'0');if(v)boot();syncSoundUI();}
 function setMusic(v){musicOn=v;localStorage.setItem('fold_music',v?'1':'0');if(v){boot();startAmbience();}else stopAmbience();syncSoundUI();}
 function engage(){boot();if(musicOn)startAmbience();}
 function state(){return{sfxOn,musicOn,unlocked};}
 document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(unlocked)ctx.resume();});
 return{engage,slide,invalid,merge,unity,logo,setSfx,setMusic,state};
})();

function move(dr,dc){
 if(done) return;
 FOLD_AUDIO.engage();
 const snap=JSON.stringify(tiles.map(t=>({id:t.id,r:t.r,c:t.c,v:t.v})));
 const order=[...tiles].sort((a,b)=>((b.r-a.r)*dr+(b.c-a.c)*dc));
 let moved=false,mergeCount=0; const mergedIds=new Set();
 for(const t of order){
   let r=t.r,c=t.c;
   while(true){
     const nr=r+dr,nc=c+dc;
     if(nr<0||nr>=R||nc<0||nc>=C||isWall(nr,nc)) break;
     const occ=tileAt(nr,nc,tiles);
     if(!occ){ r=nr;c=nc; continue; }
     if(occ.v===t.v && !mergedIds.has(occ.id) && occ.id!==t.id){
       occ.v*=2; occ.merged=true; mergedIds.add(occ.id);
       tiles=tiles.filter(x=>x.id!==t.id); moved=true; mergeCount++;
     }
     break;
   }
   if((r!==t.r||c!==t.c)){ t.r=r;t.c=c; moved=true; }
 }
 if(moved){ hist.push(snap); moves++; render(); syncText(); if(mergeCount)FOLD_AUDIO.merge(mergeCount);else FOLD_AUDIO.slide(); checkWin();

(function(){
  const API = window.TEL_API || (window.API || "");
  const pid = (function(){let p=localStorage.getItem("tel_pid");
    if(!p){p="u"+Math.random().toString(36).slice(2,10);localStorage.setItem("tel_pid",p);}return p;})();
  const sid = "s"+Math.random().toString(36).slice(2,10);
  const t0 = Date.now();
  let queue = [];
  function push(etype,name,value,dur){
    queue.push({pid,sid,etype,name:String(name||"").slice(0,120),
                value:typeof value==="string"?value:JSON.stringify(value||""),dur:dur||0});
    if(queue.length>=8) flush();
  }
  function flush(useBeacon){
    if(!queue.length||!API) return;
    const batch = queue.splice(0,50);
    const body = JSON.stringify(batch);
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(API+"/tel_batch", new Blob([body],{type:"application/json"}));
    } else {
      fetch(API+"/tel_batch",{method:"POST",headers:{"Content-Type":"application/json"},body}).catch(()=>{});
    }
  }
  // 自动: pageview
  push("pageview", location.pathname||"/", document.title||"");
  // 自动: 所有click(记录元素id/class/文本)
  document.addEventListener("click", e=>{
    const el=e.target.closest("button,a,[data-tel],.card,.chip,[role=button]");
    if(!el)return;
    push("click", el.id||el.dataset.tel||el.className||el.tagName,
         (el.innerText||"").trim().slice(0,60));
  }, true);
  // 自动: 会话时长(离开时上报)
  window.addEventListener("beforeunload", ()=>{
    push("session_end","session","",Math.round((Date.now()-t0)/1000));
    flush(true);
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(true); });
  setInterval(()=>flush(), 20000);   // 定期flush
  // 暴露手动埋点: TEL.chat(用户消息,回复) / TEL.feedback(分数,留言) / TEL.ev(类型,名,值)
  window.TEL = {
    chat: (userMsg, reply, meta)=>push("chat","message",{u:String(userMsg).slice(0,800),r:String(reply).slice(0,1200),...(meta||{})}),
    feedback: (score, note)=>push("feedback","rating",{score,note:String(note||"").slice(0,500)}),
    ev: (name, value)=>push("custom",name,value),
    flush
  };
})();
</script>


<script>
/* 通用等待动画: 任何异步请求期间显示"思考中"呼吸提示, 零服务器成本 */
(function(){
  let _wt=null;
  const HINTS={zh:["正在思考…","整理中…","正在分析…","稍等一下…"],
               en:["thinking…","working on it…","analyzing…","one moment…"]};
  window.showWaiting=function(elId){
    const el=document.getElementById(elId)||document.querySelector("[data-wait]")||document.body;
    const zh=(document.documentElement.lang||navigator.language||"").toLowerCase().startsWith("zh");
    const hints=zh?HINTS.zh:HINTS.en;
    let d=0,hi=Math.floor(Math.random()*hints.length);
    window._waitEl=el; window._waitPrev=el.innerHTML;
    _wt=setInterval(()=>{d=(d+1)%4;
      el.innerHTML=`<div style="opacity:.6;font-style:italic;padding:12px">${hints[hi]}${".".repeat(d)}</div>`;
      if(d===0&&Math.random()<0.3)hi=(hi+1)%hints.length;},520);
  };
  window.hideWaiting=function(){if(_wt){clearInterval(_wt);_wt=null;}};
})();
</script>

<button id="uxFbBtn" onclick="uxOpenFb()">◇</button>

    <h3 id="uxFbQ"></h3>

  </div>

<script>
/* 评价UI - 跟随五语界面，并保持游戏品牌语气 */
(function(){
  const T={
    zh:{btn:"◇ 留墨",q:"这一局，可还顺心？",ph:"留下一句话（可选）",send:"落 款",done:"已收下。谢谢你。"},
    ja:{btn:"◇ 感想",q:"この一局、いかがでしたか？",ph:"ひとこと（任意）",send:"送 る",done:"受け取りました。ありがとう。"},
    en:{btn:"◇ Reflect",q:"How did this fold feel?",ph:"Leave a thought (optional)",send:"SEND",done:"Received. Thank you."},
    es:{btn:"◇ Opinar",q:"¿Qué tal se sintió este pliegue?",ph:"Deja una idea (opcional)",send:"ENVIAR",done:"Recibido. Gracias."},
    pt:{btn:"◇ Opinar",q:"Como foi esta dobra?",ph:"Deixe uma ideia (opcional)",send:"ENVIAR",done:"Recebido. Obrigado."}
  };
  window.uxT=function(){return T[(typeof lang!=="undefined"&&T[lang])?lang:"en"];};
  window.uxSyncLabels=function(){
    const t=uxT(), b=document.getElementById("uxFbBtn");
    if(b)b.textContent=t.btn;
  };
  document.addEventListener("DOMContentLoaded",uxSyncLabels);
  setTimeout(uxSyncLabels,300);
})();
let uxScore=0;
function uxEmos(){const es=[["\ud83d\ude0d",3],["\ud83d\ude10",2],["\ud83e\udd71",1]];
 document.getElementById("uxFbEmos").innerHTML=es.map(([e,s])=>
  `<button class="uxEmo${uxScore===s?" sel":""}" onclick="uxPick(${s})">${e}</button>`).join("");}
function uxOpenFb(){const t=uxT();uxScore=0;
 document.getElementById("uxFbQ").textContent=t.q;
 document.getElementById("uxFbNote").placeholder=t.ph;
 const sb=document.getElementById("uxFbSend");sb.textContent=t.send;sb.disabled=true;
 uxEmos();document.getElementById("uxFbOv").classList.add("show");}
function uxCloseFb(){document.getElementById("uxFbOv").classList.remove("show");}
function uxPick(s){uxScore=s;uxEmos();document.getElementById("uxFbSend").disabled=false;}
function uxSendFb(){
 const note=document.getElementById("uxFbNote").value;
 if(window.TEL)TEL.feedback(uxScore,note);
 document.getElementById("uxFbCard").innerHTML=`<h3 style="margin:20px 0">${uxT().done}</h3>`;
 setTimeout(uxCloseFb,1200);
}
</script>
